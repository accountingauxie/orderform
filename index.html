<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Pemesanan – Xero Clone v4</title>

<link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>
:root {
  --xero-bg: #F5F6F7;
  --xero-border: #E3E6E8;
  --xero-text: #253858;
  --xero-muted: #6B778C;
  --xero-blue: #1F6EF3;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 0 40px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--xero-bg);
  color: var(--xero-text);
}

/* HEADER BAR SIMPLE */
.page-header {
  max-width: 1240px;
  margin: 0 auto 12px;
  padding: 0 24px;
  font-size: 12px;
  color: var(--xero-muted);
}

/* MAIN CARD SEPERTI XERO */
.xero-card {
  background: #ffffff;
  border: 1px solid var(--xero-border);
  border-radius: 8px;
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 32px 28px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

.card-title {
  font-size: 22px;
  font-weight: 600;
  margin: 0 0 20px;
}

/* TOP ROW: DATE + CUSTOMER (kayak Issue date/Contact) */
.top-row {
  display: grid;
  grid-template-columns: 1.1fr 2fr;
  gap: 18px 24px;
  margin-bottom: 24px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
  color: #4A5568;
}

input, select {
  width: 100%;
  height: 40px;
  font-size: 14px;
  padding: 6px 10px;
  border-radius: 4px;
  border: 1px solid #C4C7CC;
  background: #ffffff;
}

/* TABLE AREA */
.table-wrapper {
  margin-top: 6px;
  overflow: visible !important; /* NO SCROLL DI TABEL */
}

.xero-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;          /* supaya width kolom nurut */
  background: #ffffff;
}

/* HEADER TABEL – XERO STYLE */
.xero-table thead th {
  background: #F3F4F5;
  border-bottom: 1px solid #D9DCE0;
  padding: 10px 8px;
  font-size: 12px;
  font-weight: 600;
  color: #4A4F59;
  text-align: left;
  white-space: nowrap;
}

/* CELL TABEL */
.xero-table td {
  border-bottom: 1px solid #E5E7EB;
  padding: 8px 8px;
  background: #ffffff;
}

.xero-table input {
  width: 100%;
  height: 34px;
  border-radius: 4px;
  border: 1px solid #D2D6DB;
  padding: 5px 6px;
  font-size: 14px;
}

/* LEBAR KOLOM SESUAI STRUKTUR YANG KAMU MAU */
/* 1 = drag, 2=Product, 3=Meter, 4=Qty, 5=UnitPrice, 6=Price/Qty, 7=Discount, 8=SubTotal, 9=Tax, 10=Total, 11=delete */

.xero-table th:nth-child(1),
.xero-table td:nth-child(1) { width: 28px; }

.xero-table th:nth-child(2),
.xero-table td:nth-child(2) { width: 28%; }

.xero-table th:nth-child(3),
.xero-table td:nth-child(3) { width: 8%; }

.xero-table th:nth-child(4),
.xero-table td:nth-child(4) { width: 7%; }

.xero-table th:nth-child(5),
.xero-table td:nth-child(5) { width: 10%; }

.xero-table th:nth-child(6),
.xero-table td:nth-child(6) { width: 10%; }

.xero-table th:nth-child(7),
.xero-table td:nth-child(7) { width: 8%; }

.xero-table th:nth-child(8),
.xero-table td:nth-child(8) { width: 9%; }

.xero-table th:nth-child(9),
.xero-table td:nth-child(9) { width: 7%; }

.xero-table th:nth-child(10),
.xero-table td:nth-child(10) { width: 11%; }

.xero-table th:nth-child(11),
.xero-table td:nth-child(11) { width: 30px; }

/* drag handle */
.col-drag {
  text-align: center;
  cursor: grab;
  color: #9AA5B1;
  font-size: 18px;
}

/* delete button */
.delete-btn {
  background: none;
  border: none;
  color: #B00020;
  font-size: 18px;
  cursor: pointer;
}

/* Choices.js – dropdown jangan kepotong */
.choices {
  width: 100%;
}

.choices__inner {
  border-radius: 4px !important;
  border-color: #D2D6DB !important;
  min-height: 34px !important;
  padding: 2px 6px !important;
}

.choices__list--dropdown,
.choices__list[aria-expanded] {
  position: absolute !important;
  width: 100% !important;
  z-index: 9999 !important;
  background: #ffffff;
  border: 1px solid #C4C7CC;
  max-height: 260px;
  overflow-y: auto;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Add row button – gaya Xero */
#addLine {
  margin-top: 16px;
  background: #ffffff;
  border: 1px solid #C5C7D0;
  padding: 7px 14px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  color: #2F3F52;
  cursor: pointer;
}

/* SUMMARY (Sub Total, PPN, Grand Total) */
.summary-box {
  margin-top: 32px;
  float: right;
  text-align: right;
}

.summary-box table { border-collapse: collapse; }
.summary-box td { padding: 5px 4px; font-size: 13px; }

.summary-box input {
  width: 170px;
  height: 32px;
  border-radius: 4px;
  border: 1px solid #C4C7CC;
  text-align: right;
  padding: 4px 6px;
  background: #FAFAFA;
  font-weight: 600;
}

/* Notes & submit */
.notes-area {
  margin-top: 40px;
  clear: both;
}

.notes-area textarea {
  width: 100%;
  min-height: 120px;
  border-radius: 4px;
  border: 1px solid #C4C7CC;
  padding: 10px;
  font-size: 14px;
  resize: vertical;
}

.actions-bar {
  margin-top: 20px;
  text-align: right;
}

button[type="submit"] {
  background: var(--xero-blue);
  color: #ffffff;
  border: none;
  border-radius: 4px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

/* Responsive sedikit */
@media (max-width: 900px) {
  .xero-card { padding: 18px 16px 22px; }
  .top-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="page-header">
  Sales overview › Orders
</div>

<div class="xero-card">
  <h1 class="card-title">Form Pemesanan</h1>

  <form id="orderForm">
    <!-- TOP -->
    <div class="top-row">
      <div>
        <label>Date</label>
        <input type="date" id="date" required>
      </div>
      <div>
        <label>Customer</label>
        <select id="customer" required></select>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
      <table class="xero-table">
        <thead>
          <tr>
            <th></th>
            <th>Product</th>
            <th>Meter</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Price/Qty</th>
            <th>Discount</th>
            <th>Sub Total</th>
            <th>Tax</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="orderBody"></tbody>
      </table>
    </div>

    <button type="button" id="addLine">Add row</button>

    <!-- SUMMARY -->
    <div class="summary-box">
      <table>
        <tr><td>Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
        <tr><td>PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
        <tr><td><strong>Grand Total</strong></td><td><input type="text" id="grandTotal" readonly></td></tr>
      </table>
    </div>

    <!-- NOTES -->
    <div class="notes-area">
      <label>Catatan tambahan</label>
      <textarea id="catatan"></textarea>
    </div>

    <div class="actions-bar">
      <button type="submit">Kirim Order</button>
    </div>
  </form>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

<!-- Default 3 rows – pakai addRow() dari script.js -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof addRow === "function") {
    addRow(); addRow(); addRow();
  }
});
</script>

</body>
</html>
