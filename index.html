<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Order Form</title>

  <!-- === STYLING === -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
    }
    h2 {
      color: #2b5da4;
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-weight: bold;
      margin-top: 5px;
    }
    input, textarea, select, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background-color: #2b5da4;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #23497f;
    }
    #result {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Form Pemesanan</h2>

  <form id="orderForm">
    <!-- Customer -->
    <label>Customer:</label>
    <select name="customer" id="customer" required></select>

    <!-- Product -->
    <label>Product:</label>
    <select name="product" id="product" required></select>

    <!-- Thickness -->
    <label>Thickness:</label>
    <select name="thickness" id="thickness" required></select>

    <!-- Colour -->
    <label>Colour:</label>
    <select name="colour" id="colour" required></select>

    <!-- Meter -->
    <label>Meter:</label>
    <input type="number" step="0.01" name="meter" id="meter" required>

    <!-- Quantity -->
    <label>Quantity:</label>
    <input type="number" step="1" name="quantity" id="quantity" required>

    <!-- Unit Price -->
    <label>Unit Price:</label>
    <input type="number" step="0.01" name="unitPrice" id="unitPrice" readonly>

    <!-- Price per Quantity -->
    <label>Price per Quantity:</label>
    <input type="number" step="0.01" name="pricePerQty" id="pricePerQty" readonly>

    <!-- Total Price -->
    <label>Total Price:</label>
    <input type="number" step="0.01" name="totalPrice" id="totalPrice" readonly>

    <!-- Notes -->
    <label>Catatan tambahan:</label>
    <textarea name="catatan" rows="3"></textarea>

    <button type="submit">Kirim Order</button>
  </form>

  <p id="result"></p>

  <!-- === SCRIPT LIBRARY === -->
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<script>
const baseURL = 'https://script.google.com/macros/s/AKfycbYOUR_DEPLOYMENT_ID/exec'; // Ganti ID kamu

const form = document.getElementById('orderForm');
const result = document.getElementById('result');

let choiceCustomer, choiceProduct, choiceThickness, choiceColour;

// === LOAD DROPDOWN DATA ===
async function loadDropdowns() {
  result.textContent = "⏳ Loading data...";
  try {
    const res = await fetch(`${baseURL}?action=getdata`, { cache: "no-store" });
    const data = await res.json();
    console.log("✅ Data loaded:", data);

    if (!data.customers || !data.products) throw new Error("Data kosong");

    // destroy existing
    if (choiceCustomer) choiceCustomer.destroy();
    if (choiceProduct) choiceProduct.destroy();
    if (choiceThickness) choiceThickness.destroy();
    if (choiceColour) choiceColour.destroy();

    // init Choices
    choiceCustomer = new Choices('#customer', { searchEnabled: true, shouldSort: false });
    choiceProduct = new Choices('#product', { searchEnabled: true, shouldSort: false });
    choiceThickness = new Choices('#thickness', { searchEnabled: true, shouldSort: false });
    choiceColour = new Choices('#colour', { searchEnabled: true, shouldSort: false });

    // populate dropdown
    choiceCustomer.setChoices(data.customers.map(v => ({ value: v, label: v })), 'value', 'label', true);
    choiceProduct.setChoices(data.products.map(v => ({ value: v, label: v })), 'value', 'label', true);
    choiceThickness.setChoices(data.thicknesses.map(v => ({ value: v, label: v })), 'value', 'label', true);
    choiceColour.setChoices(data.colours.map(v => ({ value: v, label: v })), 'value', 'label', true);

    result.textContent = "";
  } catch (err) {
    console.error("❌ Dropdown error:", err);
    result.textContent = "❌ Gagal memuat dropdown. Periksa URL base atau Apps Script.";
  }
}
loadDropdowns();
</script>
</body>
</html>
