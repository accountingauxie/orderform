<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Form Pemesanan – Xero Style</title>

  <!-- Choices.js -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">

  <!-- Sortable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --border: #d6dce1;
      --border-light: #e3e7eb;
      --header-bg: #f5f7fa;
      --text-muted: #697386;
      --blue: #0075c9;
      --bg: #f5f7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: #1f2933;
    }

    .top-bar {
      padding: 14px 36px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
    }
    .top-bar span { color: #9aa5b1; }

    .page-wrap {
      display: flex;
      justify-content: center;
      padding: 32px 0 56px;
    }

    .invoice-card {
      width: 1150px;
      max-width: 92vw;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 32px 34px 44px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    h2.card-title {
      margin: 0 0 18px;
      font-size: 20px;
      font-weight: 600;
    }

    .header-grid {
      display: grid;
      grid-template-columns: 2.1fr 1.1fr 1.1fr;
      gap: 18px;
      margin-bottom: 22px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="date"],
    select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      background: #fff;
    }

    input[type="number"] {
      width: 100%;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
      text-align: right;
    }

    .choices__inner {
      min-height: 36px !important;
      padding: 6px 10px !important;
      border-radius: 4px !important;
      border: 1px solid var(--border) !important;
    }

    /* 🔥 DROPDOWN ALWAYS FRONT */
    .choices__list--dropdown,
    .choices__list {
      z-index: 9999 !important;
      position: relative !important;
    }

    .table-wrapper {
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: visible !important; /* 🔥 allow dropdown to overflow */
      background: #ffffff;
      margin-bottom: 14px;
    }

    table.items-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .items-table col:nth-child(1) { width: 3%; }
    .items-table col:nth-child(2) { width: 9%; }
    .items-table col:nth-child(3) { width: 30%; }
    .items-table col:nth-child(4) { width: 7%; }
    .items-table col:nth-child(5) { width: 7%; }
    .items-table col:nth-child(6) { width: 11%; }
    .items-table col:nth-child(7) { width: 11%; }
    .items-table col:nth-child(8) { width: 11%; }
    .items-table col:nth-child(9) { width: 11%; }
    .items-table col:nth-child(10){ width: 3%; }

    th {
      background: var(--header-bg);
      padding: 9px 8px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 8px 8px;
      border-bottom: 1px solid var(--border-light);
      background: #ffffff;
      height: 40px;
    }

    .drag-handle { cursor: grab; text-align: center; color: #8d99a6; }
    .delete-row { cursor: pointer; color: #d33; text-align: center; }

    .add-row-btn {
      margin-top: 6px;
      margin-bottom: 26px;
      padding: 4px 10px;
      font-size: 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
    }

    .notes-and-totals {
      display: grid;
      grid-template-columns: 2.1fr 1fr;
      gap: 30px;
    }

    textarea {
      width: 100%;
      height: 170px;
      border-radius: 4px;
      border: 1px solid var(--border);
      padding: 10px;
      resize: none;
    }

    .totals-box {
      text-align: right;
      font-size: 13px;
      line-height: 1.7;
    }

    .footer-actions {
      text-align: right;
      margin-top: 26px;
    }

    .btn-primary {
      padding: 8px 28px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="top-bar">
  UXILIUM <span>Accounting Management Services</span>
</div>

<div class="page-wrap">
  <div class="invoice-card">

    <h2 class="card-title">Form Pemesanan</h2>

    <div class="header-grid">
      <div>
        <span class="field-label">Contact</span>
        <select id="customerSelect"></select>
      </div>

      <div>
        <span class="field-label">Issue date</span>
        <input type="date" id="issueDate">
      </div>

      <div>
        <span class="field-label">Order number</span>
        <input type="text" id="orderNumber" readonly>
      </div>
    </div>

    <div class="table-wrapper">
      <table class="items-table">
        <colgroup>
          <col><col><col><col><col><col><col><col><col><col>
        </colgroup>
        <thead>
        <tr>
          <th></th>
          <th>Type</th>
          <th>Item</th>
          <th>Meter</th>
          <th>Qty</th>
          <th>Unit Price</th>
          <th>Discount / Unit</th>
          <th>Price/Qty</th>
          <th>Total</th>
          <th></th>
        </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>

    <button class="add-row-btn" type="button" onclick="addRow()">Add row ▾</button>

    <div class="notes-and-totals">
      <div>
        <span class="field-label">Catatan:</span>
        <textarea id="notes"></textarea>
      </div>

      <div class="totals-box">
        <div><span>DPP</span> <span id="dppDisplay">Rp 0,00</span></div>
        <div><span>PPN 11%</span> <span id="ppnDisplay">Rp 0,00</span></div>
        <div style="margin-top:6px;">
          <span style="font-weight:600">Grand Total</span>
          <span id="grandTotalDisplay" style="font-weight:700">Rp 0,00</span>
        </div>
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn-primary" type="button">Approve</button>
    </div>

  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="script.js"></script>

</body>
</html>
