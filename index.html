<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Form Pemesanan</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>

/* ================= GLOBAL ================= */
body {
  font-family: Arial, sans-serif;
  max-width: 1400px;
  margin: 40px auto;
  padding: 0 40px;
}

h2 {
  text-align: center;
  font-size: 26px;
  color: #2b5da4;
  margin-bottom: 30px;
}

label {
  font-weight: bold;
  margin-bottom: 6px;
  display: block;
}

input, select, textarea {
  font-size: 14px;
}

/* Input styling */
input[type="text"],
input[type="number"],
input[type="date"],
.choices__inner {
  height: 42px !important;
  border-radius: 6px;
  border: 1px solid #d3d7dc;
  padding: 0 12px;
  box-sizing: border-box;
  background: white;
}

.choices__inner {
  display: flex !important;
  align-items: center !important;
}

/* ================= TOP ================= */
.top-row {
  display: flex;
  gap: 60px;
  margin-bottom: 30px;
}

.top-row div {
  flex: 1;
}

/* ================= TABLE ================= */
.xero-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 20px;
}

.xero-table th {
  padding: 14px;
  border: 1px solid #dcdcdc;
  background: #f7f7f7;
  text-align: left;
}

.xero-table td {
  padding: 12px;
  border: 1px solid #e6e6e6;
  background: white;
}

/* DRAG */
.col-drag {
  width: 30px;
  text-align: center;
  opacity: 0.4;
  cursor: grab;
}

/* ITEM — LEBAR BESAR */
.xero-table th:nth-child(2),
.xero-table td:nth-child(2) {
  width: 45% !important;
  min-width: 450px !important;
}

/* METER — PENDEK */
.xero-table th:nth-child(3),
.xero-table td:nth-child(3) {
  width: 90px !important;
  min-width: 80px !important;
  max-width: 100px !important;
}

/* QTY — PENDEK */
.xero-table th:nth-child(4),
.xero-table td:nth-child(4) {
  width: 80px !important;
  min-width: 70px !important;
  max-width: 90px !important;
}

/* DELETE */
.delete-btn {
  border: none;
  background: none;
  color: red;
  font-size: 20px;
  cursor: pointer;
}

/* Add row button */
#addLine {
  padding: 10px 16px;
  background: #e7f1ff;
  border: 1px solid #c7dcff;
  border-radius: 5px;
  color: #2b5da4;
  font-weight: 600;
  margin-bottom: 10px;
}

/* ================= SUMMARY ================= */
.summary-container {
  display: flex;
  justify-content: flex-end;
  margin-top: 15px;
}

.summary-box {
  width: 260px;
}

.summary-box table {
  width: 100%;
}

.summary-box td:first-child { text-align: left; }
.summary-box td:last-child { text-align: right; }

.summary-box input {
  width: 100%;
  padding: 8px;
  height: 38px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

/* Submit button */
.submit-container {
  margin-top: 10px;
  display: flex;
  justify-content: flex-end;
}

#submitBtn {
  width: 260px;
  padding: 12px;
  background: #2b5da4;
  color: white;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

#submitBtn:hover {
  background: #1d4f8a;
}

/* ================= NOTES ================= */
.notes-section {
  margin-top: 40px;
}

textarea {
  width: 100%;
  min-height: 140px;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

/* ================= ERROR HIGHLIGHT ================= */
.input-error {
  border: 2px solid #ff4d4d !important;
  background: #ffecec !important;
}

/* ================= LOADING OVERLAY ================= */
#loadingOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(2px);
  z-index: 99999;
  color: white;
  font-size: 22px;
  font-weight: bold;
  align-items: center;
  justify-content: center;
}

</style>
</head>

<body>

<h2>Form Pemesanan</h2>

<form id="orderForm">

  <!-- TOP -->
  <div class="top-row">
    <div>
      <label>Date</label>
      <input type="date" id="date" name="date">
    </div>

    <div>
      <label>Customer</label>
      <select id="customer" name="customer"></select>
    </div>
  </div>

  <!-- TABLE -->
  <table class="xero-table">
    <thead>
      <tr>
        <th></th>
        <th>Item</th>
        <th>Meter</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Price/Qty</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <!-- SUMMARY -->
  <div class="summary-container">
    <div class="summary-box">
      <table>
        <tr><td>Sub Total</td><td><input id="subTotal" readonly></td></tr>
        <tr><td>PPN 11%</td><td><input id="ppn" readonly></td></tr>
        <tr><td><b>Grand Total</b></td><td><input id="grandTotal" readonly></td></tr>
      </table>
    </div>
  </div>

  <div class="submit-container">
    <button type="submit" id="submitBtn">Kirim Order</button>
  </div>

  <!-- NOTES -->
  <div class="notes-section">
    <label>Catatan tambahan</label>
    <textarea name="catatan"></textarea>
  </div>

</form>

<!-- LOADING -->
<div id="loadingOverlay">Processing Order...</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>


<script>
/* =====================================================
     JAVASCRIPT LOGIC FINAL  
===================================================== */

document.getElementById("addLine").addEventListener("click", function () {
    const tbody = document.getElementById("orderBody");
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="col-drag">⋮⋮</td>
      <td><select class="product-select"></select></td>
      <td><input type="number" class="meter" min="0"></td>
      <td><input type="number" class="qty" min="0"></td>
      <td><input type="text" class="unitPrice" readonly></td>
      <td><input type="text" class="ppq" readonly></td>
      <td><input type="text" class="totalPrice" readonly></td>
      <td><button class="delete-btn">🗑</button></td>
    `;

    tbody.appendChild(tr);

    new Choices(tr.querySelector(".product-select"), { searchEnabled: true });

    tr.querySelector(".delete-btn").onclick = () => tr.remove();
});

/* ===================== VALIDATION ===================== */

document.getElementById("orderForm").addEventListener("submit", function (e) {

    let hasError = false;

    document.querySelectorAll(".input-error").forEach(el => el.classList.remove("input-error"));

    const date = document.getElementById("date");
    const customer = document.getElementById("customer");

    if (!date.value.trim()) { date.classList.add("input-error"); hasError = true; }
    if (!customer.value.trim()) {
        customer.closest(".choices").querySelector(".choices__inner").classList.add("input-error");
        hasError = true;
    }

    document.querySelectorAll("#orderBody tr").forEach(row => {
        const item = row.querySelector(".product-select")?.value;
        const meter = row.querySelector(".meter");
        const qty = row.querySelector(".qty");

        if (item) {
            if (!meter.value.trim() || meter.value < 0) {
                meter.classList.add("input-error");
                hasError = true;
            }
            if (!qty.value.trim() || qty.value < 0) {
                qty.classList.add("input-error");
                hasError = true;
            }
        }
    });

    if (hasError) {
        e.preventDefault();
        alert("Periksa kembali field yang berwarna merah.");
        return;
    }

    // SHOW LOADING
    document.getElementById("loadingOverlay").style.display = "flex";
    document.getElementById("submitBtn").disabled = true;
    document.getElementById("submitBtn").innerText = "Processing...";
});
</script>

</body>
</html>
