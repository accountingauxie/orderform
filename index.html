<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan (Xero Style)</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
/* =========================
   GLOBAL FORM LAYOUT
========================= */
body {
  font-family: Arial, sans-serif;
  max-width: 1400px;
  width: 100%;
  margin: 40px auto;
  padding: 0 40px;
}

h2 {
  color: #2b5da4;
  text-align: center;
  margin-bottom: 25px;
}

/* =========================
   INPUTS
========================= */
input, select, textarea {
  font-size: 14px;
  font-family: inherit;
}

input[type="text"],
input[type="number"],
input[type="date"] {
  height: 42px;
  line-height: 42px;
  border-radius: 6px;
  border: 1px solid #d3d7dc;
  padding: 0 12px;
  background: white;
  box-sizing: border-box;
}

/* Choices container mengikuti tinggi input */
.choices__inner {
  min-height: 42px;
  border-radius: 6px !important;
  border: 1px solid #d3d7dc !important;
  padding: 0 12px !important;
  display: flex;
  align-items: center;
}

/* prevent minus */
input[type="number"] {
  min: 0;
}

/* DATE FIX */
input[type="date"]::-webkit-calendar-picker-indicator {
  cursor: pointer;
  filter: opacity(60%);
}

/* =========================
   TOP ROW
========================= */
.top-row {
  display: flex;
  gap: 50px;
  margin-bottom: 20px;
}
.top-row div { flex: 1; }
.top-row label { font-weight: bold; }

/* =========================
   TABLE (XERO STYLE)
========================= */
.xero-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 6px;
}

.xero-table th {
  background: #f7f7f7;
  padding: 10px 12px;
  border-bottom: 1px solid #e4e7ea;
  border-top: 1px solid #e4e7ea;
  font-weight: 600;
  white-space: nowrap;
  text-align: center;
}

.xero-table td {
  padding: 8px 12px;
  border-top: 1px solid #e4e7ea;
  border-bottom: 1px solid #e4e7ea;
  background: white;
  vertical-align: middle;
}

.xero-table td input,
.xero-table td select,
.xero-table td .choices {
  width: 100%;
}

/* DRAG COLUMN */
.col-drag {
  cursor: grab;
  text-align: center;
  width: 18px;
  padding: 0;
  font-size: 16px;
  opacity: 0.5;
}

/* DELETE BUTTON */
.delete-btn {
  background: none;
  border: none;
  color: red;
  font-size: 20px;
  cursor: pointer;
}

/* ADD ROW BUTTON */
#addLine {
  margin-top: 12px;
  background: #e7f1ff;
  border: 1px solid #c7dcff;
  padding: 10px 16px;
  border-radius: 4px;
  color: #2b5da4;
  font-weight: 600;
  cursor: pointer;
}

/* =========================
   SUMMARY BOX
========================= */
.summary-box {
  width: 420px;
  float: right;
  margin-top: 25px;
}

.summary-box table {
  width: 100%;
}

.summary-box td:first-child {
  padding-right: 10px;
}

.summary-box input {
  width: 100%;
  height: 32px;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

/* SUBMIT BUTTON BELOW GRAND TOTAL */
#submitBtn {
  margin-top: 16px;
  float: right;
  background: #2b5da4;
  border: none;
  padding: 10px 20px;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
}
#submitBtn:hover {
  background: #1f4988;
}

/* =========================
   FOOTER NOTES
========================= */
.footer-area {
  clear: both;
  margin-top: 55px;
}

textarea {
  width: 100%;
  min-height: 120px;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  resize: vertical;
  font-size: 15px;
}

/* =========================
   MODAL
========================= */
#modal-bg {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:2000;
}

/* =========================
   MOBILE
========================= */
@media (max-width: 768px) {
  body { padding: 0 10px; }
  .top-row { flex-direction: column; gap: 12px; }
  .summary-box { width: 100%; float:none; margin-top: 35px; }
}

/* =========================
   PRINT
========================= */
@media print {
  @page { size: landscape; }
  #addLine, button, textarea { display: none !important; }
}
  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">

  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" name="date" required>
    </div>

    <div>
      <label>Customer</label><br>
      <select id="customer" name="customer" required></select>
    </div>
  </div>

  <!-- TABLE -->
  <table class="xero-table">
    <thead>
      <tr>
        <th style="width:25px;"></th>
        <th style="min-width:260px; width:32%;">Item</th>
        <th style="min-width:90px; width:10%;">Meter</th>
        <th style="min-width:80px; width:8%;">Qty</th>
        <th style="min-width:120px; width:15%;">Unit Price</th>
        <th style="min-width:120px; width:15%;">Price/Qty</th>
        <th style="min-width:140px; width:18%;">Total</th>
        <th style="width:40px;"></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <!-- SUMMARY + SUBMIT -->
  <div class="summary-box">
    <table>
      <tr><td>Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
      <tr><td>PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
      <tr><td><b>Grand Total</b></td><td><input type="text" id="grandTotal" readonly></td></tr>
    </table>
    <button type="submit" id="submitBtn">Kirim Order</button>
  </div>

  <div class="footer-area">
      <label>Catatan tambahan</label>
      <textarea name="catatan"></textarea>
  </div>

</form>

<!-- MODAL ADD CUSTOMER -->
<div id="modal-bg">
  <div id="modal-box">
    <h3>Tambah Customer Baru</h3>
    <input id="newCustomerName" placeholder="Nama customer..." />
    <button id="saveCustomerBtn">Simpan</button>
  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
