<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<title>Order Form – Xero Ultra Modern</title>

<link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>
/* --------------------------------------------------
      XERO COLOR SYSTEM (2024 ULTRA MODERN)
-------------------------------------------------- */
:root {
  --xero-blue: #1F6FF2;
  --xero-blue-light: #E8F0FE;
  --text-dark: #1A1F36;
  --text-muted: #6B7280;
  --border: #E5E7EB;
  --bg: #F5F7FA;
  --row-hover: #F9FAFB;
  --input-border: #D1D5DB;
}

* { box-sizing: border-box; }

/* --------------------------------------------------
      BODY LAYOUT
-------------------------------------------------- */
body {
  background: var(--bg);
  margin: 0;
  padding: 30px 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* CARD */
.xero-card {
  background: #fff;
  width: 1320px;
  margin: auto;
  padding: 34px 38px;
  border-radius: 10px;
  border: 1px solid #E1E4E8;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

/* TITLE */
.card-title {
  font-size: 24px;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 30px;
}

/* --------------------------------------------------
      TOP GRID (Xero style 2 rows)
-------------------------------------------------- */
.top-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr) 100px;
  gap: 24px;
  margin-bottom: 30px;
}

label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: block;
}

input, select {
  width: 100%;
  height: 42px;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--input-border);
  font-size: 14px;
}

/* Focus effect mirip Xero */
input:focus, select:focus, textarea:focus {
  outline: 2px solid rgba(31,111,242,0.25);
  border-color: var(--xero-blue);
  box-shadow: 0 0 0 3px rgba(31,111,242,0.12);
}

/* --------------------------------------------------
      TABLE
-------------------------------------------------- */
.table-wrapper {
  margin-top: 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.xero-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

/* HEADER */
.xero-table thead th {
  background: var(--xero-blue-light);
  padding: 12px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-dark);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

/* BODY */
.xero-table td {
  padding: 10px 10px;
  border-bottom: 1px solid var(--border);
}

.xero-table tr:hover td {
  background: var(--row-hover);
}

/* Inputs inside table */
.xero-table input {
  height: 36px;
  font-size: 14px;
  border-radius: 6px;
}

/* Column Widths */
.xero-table th:nth-child(1),
.xero-table td:nth-child(1) { width: 6%; }

.xero-table th:nth-child(2),
.xero-table td:nth-child(2) { width: 23%; }

.xero-table th:nth-child(3),
.xero-table td:nth-child(3) { width: 10%; }

.xero-table th:nth-child(4),
.xero-table td:nth-child(4) { width: 9%; }

.xero-table th:nth-child(5),
.xero-table td:nth-child(5) { width: 10%; }

.xero-table th:nth-child(6),
.xero-table td:nth-child(6) { width: 11%; }

.xero-table th:nth-child(7),
.xero-table td:nth-child(7) { width: 10%; }

.xero-table th:nth-child(8),
.xero-table td:nth-child(8) { width: 9%; }

.xero-table th:nth-child(9),
.xero-table td:nth-child(9) { width: 10%; }

.xero-table th:nth-child(10),
.xero-table td:nth-child(10) { width: 3%; }

/* --------------------------------------------------
      ADD ROW BUTTON
-------------------------------------------------- */
#addLine {
  margin-top: 16px;
  padding: 10px 16px;
  background: white;
  border: 1px solid var(--input-border);
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dark);
}

#addLine:hover {
  background: #F3F4F6;
}

/* --------------------------------------------------
      NOTES
-------------------------------------------------- */
textarea {
  width: 100%;
  min-height: 130px;
  border-radius: 8px;
  border: 1px solid var(--input-border);
  padding: 12px;
  font-size: 14px;
  margin-top: 18px;
}

/* --------------------------------------------------
      SUMMARY BOX (Right Align)
-------------------------------------------------- */
.summary-area {
  margin-top: 34px;
  float: right;
}

.summary-area table {
  width: 260px;
}

.summary-area td {
  padding: 8px 4px;
  font-size: 14px;
}

.summary-area input {
  width: 150px;
  text-align: right;
  background: #F9FAFB;
  border: 1px solid #D0D4D9;
  height: 36px;
  border-radius: 6px;
  padding-right: 8px;
  font-weight: 600;
}

/* --------------------------------------------------
      SUBMIT BUTTON (Xero Blue Big)
-------------------------------------------------- */
.submit-box {
  margin-top: 60px;
  text-align: right;
  clear: both;
}

button[type="submit"] {
  background: var(--xero-blue);
  color: white;
  padding: 12px 26px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  transition: 0.2s;
}

button[type="submit"]:hover {
  background: #0D55D8;
}
</style>
</head>

<body>

<div class="xero-card">
  <h2 class="card-title">Form Pemesanan</h2>

  <form id="orderForm">

    <!-- TOP GRID -->
    <div class="top-grid">
      <div>
        <label>Customer</label>
        <select id="customer"></select>
      </div>

      <div>
        <label>Date</label>
        <input type="date" id="date">
      </div>

      <div>
        <label>Invoice Number</label>
        <input id="invnum" placeholder="Auto">
      </div>

      <div>
        <label>Reference</label>
        <input id="reference">
      </div>

      <div></div>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
      <table class="xero-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Product</th>
            <th>Meter</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Price/Qty</th>
            <th>Discount</th>
            <th>Subtotal</th>
            <th>Tax</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="orderBody"></tbody>
      </table>
    </div>

    <button type="button" id="addLine">Add row</button>

    <label style="margin-top:25px;">Catatan:</label>
    <textarea id="catatan"></textarea>

    <!-- SUMMARY -->
    <div class="summary-area">
      <table>
        <tr><td>Subtotal</td><td><input id="subTotal" readonly></td></tr>
        <tr><td>Total tax</td><td><input id="ppn" readonly></td></tr>
        <tr><td><strong>Total</strong></td><td><input id="grandTotal" readonly></td></tr>
      </table>
    </div>

    <!-- SUBMIT -->
    <div class="submit-box">
      <button type="submit">Kirim Order</button>
    </div>

  </form>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof addRow === "function") {
    addRow(); addRow(); addRow();
  }
});
</script>

</body>
</html>
