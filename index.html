<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Order Form (Xero Style)</title>

  <!-- Choices & Sortable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
    }
    h2 { text-align: center; color: #2b5da4; }

    .customer-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }
    .customer-row label {
      font-weight: bold;
    }

    .xero-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .xero-table th {
      background: #f7f7f7;
      font-weight: 600;
      border-bottom: 2px solid #e5e5e5;
      padding: 10px 8px;
      font-size: 14px;
      color: #4a4a4a;
    }
    .xero-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #ececec;
      vertical-align: middle;
    }
    .xero-table tr:hover {
      background: #fafafa;
    }

    .col-drag { width: 25px; cursor: grab; font-size: 18px; text-align: center; }
    .col-item { width: 220px; }
    .col-meter { width: 80px; }
    .col-qty   { width: 70px; }
    .col-unit  { width: 120px; }
    .col-ppq   { width: 120px; }
    .col-total { width: 140px; }
    .col-delete{ width: 40px; text-align: center; }

    .xero-table input,
    .xero-table select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }

    .col-item select { text-align: left; }
    .col-meter input,
    .col-qty input,
    .col-unit input,
    .col-ppq input,
    .col-total input { text-align: right; }

    .delete-btn {
      background: none;
      border: none;
      color: #c00;
      font-size: 18px;
      cursor: pointer;
    }

    #addLine {
      margin-top: 10px;
      background: #e7f1ff;
      border: 1px solid #c7dcff;
      padding: 8px 14px;
      border-radius: 4px;
      color: #2b5da4;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"] {
      margin-top: 25px;
      padding: 10px 20px;
      background: #2b5da4;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    .summary-box {
      width: 300px;
      margin-left: auto;
      margin-top: 20px;
    }
    .summary-box td {
      padding: 6px;
      font-size: 14px;
    }
    .summary-label { text-align: right; }
    .summary-total { font-weight: bold; font-size: 15px; }
  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">
  <label>Date</label>
  <input type="date" id="date" required>

  <div class="customer-row">
    <label>Customer</label>
    <select id="customer" name="customer" required></select>
  </div>

  <table class="xero-table">
    <thead>
      <tr>
        <th class="col-drag"></th>
        <th class="col-item">Item</th>
        <th class="col-meter">Meter</th>
        <th class="col-qty">Qty</th>
        <th class="col-unit">Unit Price</th>
        <th class="col-ppq">Price/Qty</th>
        <th class="col-total">Total</th>
        <th class="col-delete"></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <div class="summary-box">
    <table>
      <tr>
        <td class="summary-label">Sub Total</td>
        <td><input type="text" id="subTotal" readonly data-value="0"></td>
      </tr>
      <tr>
        <td class="summary-label">PPN 11%</td>
        <td><input type="text" id="ppn" readonly data-value="0"></td>
      </tr>
      <tr>
        <td class="summary-label summary-total">Grand Total</td>
        <td><input type="text" id="grandTotal" readonly data-value="0"></td>
      </tr>
    </table>
  </div>

  <label>Catatan tambahan</label>
  <textarea name="catatan" rows="3"></textarea>

  <button type="submit">Kirim Order</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<script>
// ==== KONFIGURASI DASAR ====
const baseURL =
 "https://corsproxy.io/?https://script.google.com/macros/s/AKfycbxb7ZrEd4D0DJG5JEqV0U6FepmRlquL2MeMCL-uwY1_CrmcxAqt7rXo8bwdB4JIc5oO/exec";

const orderBody = document.getElementById("orderBody");
const result    = document.getElementById("result");

let productList = [];

// Default date = today
document.getElementById("date").value = new Date().toISOString().split("T")[0];

// Format Rupiah
function formatRupiah(num) {
  return "Rp " + Number(num).toLocaleString("id-ID");
}

// ==== LOAD DROPDOWNS ====
async function loadDropdowns() {
  try {
    const res  = await fetch(baseURL + "&action=getdata");
    const data = await res.json();

    productList = data.products || [];

    const cc = new Choices("#customer", { shouldSort:false });
    cc.setChoices(
      (data.customers || []).map(v => ({ value:v, label:v })),
      "value","label", true
    );

    // default 3 rows
    addLine(); addLine(); addLine();
  } catch(err) {
    console.error(err);
    result.textContent = "❌ Gagal load data. Cek Apps Script / CORS.";
  }
}

// ==== ADD ROW ====
function addLine() {
  const idx = orderBody.querySelectorAll("tr").length + 1;

  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="col-drag">⋮⋮</td>

    <td class="col-item">
      <select class="product-select" name="product_${idx}"></select>
    </td>

    <td class="col-meter">
      <input type="number" step="0.01" class="meter" name="meter_${idx}">
    </td>

    <td class="col-qty">
      <input type="number" step="1" class="qty" name="qty_${idx}">
    </td>

    <td class="col-unit">
      <input type="text" readonly class="unitPrice" data-value="">
    </td>

    <td class="col-ppq">
      <input type="text" readonly class="ppq" data-value="">
    </td>

    <td class="col-total">
      <input type="text" readonly class="totalPrice" data-value="">
    </td>

    <td class="col-delete">
      <button type="button" class="delete-btn">🗑</button>
    </td>
  `;

  orderBody.appendChild(tr);

  // Product dropdown
  const select = tr.querySelector(".product-select");
  const choice = new Choices(select, { searchEnabled:true, shouldSort:false });
  choice.setChoices(
    productList.map(v => ({ value:v, label:v })),
    "value","label", true
  );

  select.addEventListener("change", () => updatePrice(tr));
  tr.querySelector(".meter").addEventListener("input", () => calculateRow(tr));
  tr.querySelector(".qty").addEventListener("input",   () => calculateRow(tr));
  tr.querySelector(".delete-btn").addEventListener("click", () => {
    tr.remove();
    calculateSummary();
  });
}

// ==== LOOKUP PRICE ====
async function updatePrice(tr) {
  const product = tr.querySelector(".product-select").value;
  const unit    = tr.querySelector(".unitPrice");

  if (!product) return;

  try {
    const res      = await fetch(baseURL + "&action=getprice&product=" + encodeURIComponent(product));
    const priceRaw = parseFloat(await res.text()) || 0;

    unit.dataset.value = priceRaw;
    unit.value         = formatRupiah(priceRaw);

    calculateRow(tr);
  } catch(err) {
    console.error(err);
  }
}

// ==== HITUNG PER BARIS ====
function calculateRow(tr) {
  const meter = parseFloat(tr.querySelector(".meter").value) || 0;
  const qty   = parseFloat(tr.querySelector(".qty").value)   || 0;
  const unit  = parseFloat(tr.querySelector(".unitPrice").dataset.value) || 0;

  const ppq   = meter * unit;
  const total = ppq * qty;

  const ppqInput   = tr.querySelector(".ppq");
  const totalInput = tr.querySelector(".totalPrice");

  ppqInput.dataset.value   = ppq;
  ppqInput.value           = formatRupiah(ppq);

  totalInput.dataset.value = total;
  totalInput.value         = formatRupiah(total);

  calculateSummary();
}

// ==== HITUNG SUMMARY ====
function calculateSummary() {
  let sub = 0;
  orderBody.querySelectorAll(".totalPrice").forEach(el => {
    sub += parseFloat(el.dataset.value) || 0;
  });

  const ppn   = sub * 0.11;
  const grand = sub + ppn;

  const subEl   = document.getElementById("subTotal");
  const ppnEl   = document.getElementById("ppn");
  const grandEl = document.getElementById("grandTotal");

  subEl.dataset.value   = sub;
  ppnEl.dataset.value   = ppn;
  grandEl.dataset.value = grand;

  subEl.value   = formatRupiah(sub);
  ppnEl.value   = formatRupiah(ppn);
  grandEl.value = formatRupiah(grand);
}

// ==== SUBMIT ====
document.getElementById("orderForm").addEventListener("submit", async e => {
  e.preventDefault();

  // convert formatted → raw angka
  document.querySelectorAll("[data-value]").forEach(el => {
    el.value = el.dataset.value || 0;
  });

  try {
    const res = await fetch(baseURL, {
      method: "POST",
      body: new FormData(orderForm)
    });
    const txt = await res.text();
    result.textContent = txt.includes("✅")
      ? "✅ Order tersimpan!"
      : "❌ " + txt;
  } catch(err) {
    console.error(err);
    result.textContent = "❌ Gagal kirim order: " + err.message;
  }
});

// ==== CEGAH ENTER SUBMIT ====
document.getElementById("orderForm").addEventListener("keydown", e => {
  if (e.key === "Enter") e.preventDefault();
});

// tombol add row
document.getElementById("addLine").addEventListener("click", addLine);

// INIT
loadDropdowns();

// drag sort
Sortable.create(orderBody, {
  handle: ".col-drag",
  animation: 150
});
</script>

</body>
</html>
