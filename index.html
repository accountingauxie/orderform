<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Order Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
    h2 { color: #2b5da4; text-align: center; }
    form { display: flex; flex-direction: column; gap: 10px; }
    label { font-weight: bold; }
    input, select, textarea, button {
      padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px;
    }
    button {
      background-color: #2b5da4; color: white; border: none; cursor: pointer;
    }
    button:hover { background-color: #23497f; }
    #result { text-align: center; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Form Pemesanan</h2>
  <form id="orderForm">
    <label>Customer:</label>
    <select name="customer" id="customer" required></select>

    <label>Product:</label>
    <select name="product" id="product" required></select>

    <label>Thickness:</label>
    <select name="thickness" id="thickness" required></select>

    <label>Colour:</label>
    <select name="colour" id="colour" required></select>

    <label>Meter:</label>
    <input type="number" step="0.01" name="meter" id="meter" required>

    <label>Quantity:</label>
    <input type="number" step="1" name="quantity" id="quantity" required>

    <label>Unit Price:</label>
    <input type="number" step="0.01" name="unitPrice" id="unitPrice" readonly>

    <label>Price per Quantity:</label>
    <input type="number" step="0.01" name="pricePerQty" id="pricePerQty" readonly>

    <label>Total Price:</label>
    <input type="number" step="0.01" name="totalPrice" id="totalPrice" readonly>

    <label>Catatan tambahan:</label>
    <textarea name="catatan" rows="3"></textarea>

    <button type="submit">Kirim Order</button>
  </form>

  <p id="result"></p>

  <script>
    const backendURL = 'https://script.google.com/macros/s/AKfycbwwcS77GD4HfajFjgAc1a0UA-C9MZ_b3A2o_UepfTvMTxFIOlvx6CaYsX5W8Rlyyg7U/exec';
    const form = document.getElementById('orderForm');
    const result = document.getElementById('result');

    // === Load Dropdown Data ===
    async function loadDropdowns() {
      const res = await fetch(`${backendURL}?action=getData`);
      const data = await res.json();

      fillSelect('customer', data.customers);
      fillSelect('product', data.products);
      fillSelect('thickness', data.thicknesses);
      fillSelect('colour', data.colours);
    }

    function fillSelect(id, options) {
      const select = document.getElementById(id);
      select.innerHTML = '<option value="">-- Pilih --</option>';
      options.forEach(o => {
        const opt = document.createElement('option');
        opt.value = opt.textContent = o;
        select.appendChild(opt);
      });
    }

    // === Lookup Unit Price ===
    async function updatePrice() {
      const product = document.getElementById('product').value;
      const thickness = document.getElementById('thickness').value;
      const colour = document.getElementById('colour').value;

      if (product && thickness && colour) {
        const res = await fetch(`${backendURL}?action=getPrice&product=${encodeURIComponent(product)}&thickness=${encodeURIComponent(thickness)}&colour=${encodeURIComponent(colour)}`);
        const price = await res.text();
        document.getElementById('unitPrice').value = price || 0;
        calculateTotal();
      }
    }

    // === Hitung Harga ===
    function calculateTotal() {
      const unitPrice = parseFloat(document.getElementById('unitPrice').value) || 0;
      const meter = parseFloat(document.getElementById('meter').value) || 0;
      const qty = parseFloat(document.getElementById('quantity').value) || 0;

      const pricePerQty = unitPrice * meter;
      const totalPrice = pricePerQty * qty;

      document.getElementById('pricePerQty').value = pricePerQty.toFixed(2);
      document.getElementById('totalPrice').value = totalPrice.toFixed(2);
    }

    // === Event Listeners ===
    document.getElementById('product').addEventListener('change', updatePrice);
    document.getElementById('thickness').addEventListener('change', updatePrice);
    document.getElementById('colour').addEventListener('change', updatePrice);
    document.getElementById('meter').addEventListener('input', calculateTotal);
    document.getElementById('quantity').addEventListener('input', calculateTotal);

    // === Submit Data ===
    form.addEventListener('submit', e => {
      e.preventDefault();
      result.textContent = "⏳ Mengirim...";
      fetch(backendURL, { method: 'POST', body: new FormData(form)})
        .then(r => {
          if (!r.ok) throw new Error('Gagal kirim ke server');
          result.textContent = "✅ Order berhasil dikirim!";
          form.reset();
        })
        .catch(err => result.textContent = "❌ Terjadi kesalahan: " + err.message);
    });

    loadDropdowns();
  </script>
</body>
</html>
