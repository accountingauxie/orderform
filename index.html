<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan – Xero Style</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg: #f5f7fa;
      --card-border: #e1e4e8;
      --header-bg: #f3f4f6;
      --border-color: #e5e7eb;
      --text-dark: #1f2933;
      --text-muted: #6b778c;
      --blue: #1f6ff2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 0 40px;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text-dark);
    }

    /* CARD */
    .xero-card {
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      max-width: 1320px;
      margin: 0 auto;
      padding: 30px 34px 34px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    /* TOP GRID */
    .top-grid {
      display: grid;
      grid-template-columns: 2.2fr 1.2fr 1.2fr 1.5fr;
      gap: 18px 24px;
      margin-bottom: 26px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    input, select {
      width: 100%;
      height: 40px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #cbd2e1;
      font-size: 14px;
      background: #fff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid rgba(31,111,242,0.3);
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(31,111,242,0.15);
    }

    /* TABLE WRAPPER */
    .table-wrapper {
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    table.xero-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .xero-table thead th {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 8px;
      font-size: 12px;
      font-weight: 700;
      color: #4b5563;
      text-align: left;
      white-space: nowrap;
    }

    .xero-table tbody td {
      border-bottom: 1px solid #edf0f2;
      padding: 8px 8px;
      vertical-align: middle;
      font-size: 13px;
    }

    .xero-table tbody tr:hover td {
      background: #f9fafb;
    }

    .xero-table input {
      height: 34px;
      border-radius: 5px;
      font-size: 13px;
    }

    .col-drag {
      cursor: grab;
      text-align: center;
      color: #9ca3af;
      font-size: 16px;
      width: 40px;
    }

    /* Column widths */
    .xero-table th:nth-child(1),
    .xero-table td:nth-child(1) { width: 5%; }

    .xero-table th:nth-child(2),
    .xero-table td:nth-child(2) { width: 25%; }

    .xero-table th:nth-child(3),
    .xero-table td:nth-child(3) { width: 8%; }

    .xero-table th:nth-child(4),
    .xero-table td:nth-child(4) { width: 7%; }

    .xero-table th:nth-child(5),
    .xero-table td:nth-child(5) { width: 11%; }

    .xero-table th:nth-child(6),
    .xero-table td:nth-child(6) { width: 11%; }

    .xero-table th:nth-child(7),
    .xero-table td:nth-child(7) { width: 9%; }

    .xero-table th:nth-child(8),
    .xero-table td:nth-child(8) { width: 10%; }

    .xero-table th:nth-child(9),
    .xero-table td:nth-child(9) { width: 9%; }

    .xero-table th:nth-child(10),
    .xero-table td:nth-child(10) { width: 11%; }

    .xero-table th:nth-child(11),
    .xero-table td:nth-child(11) { width: 36px; }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #d11a2a;
    }

    /* ADD ROW */
    #addLine {
      margin-top: 14px;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #cbd2e1;
      background: #ffffff;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
    }

    #addLine:hover {
      background: #f3f4f6;
    }

    /* NOTES */
    textarea {
      width: 100%;
      min-height: 120px;
      border-radius: 8px;
      border: 1px solid #cbd2e1;
      padding: 10px;
      font-size: 14px;
      margin-top: 18px;
      resize: vertical;
    }

    /* SUMMARY */
    .summary-area {
      margin-top: 26px;
      display: flex;
      justify-content: flex-end;
    }

    .summary-area table {
      width: 260px;
    }

    .summary-area td {
      padding: 6px 4px;
      font-size: 13px;
    }

    .summary-area input {
      width: 150px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid #d0d4d9;
      padding-right: 8px;
      background: #f9fafb;
      text-align: right;
      font-weight: 600;
      font-size: 13px;
    }

    /* SUBMIT */
    .submit-box {
      margin-top: 22px;
      text-align: right;
    }

    #submitBtn {
      background: var(--blue);
      border: none;
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }

    #submitBtn:hover {
      background: #1854c9;
    }

    #submitBtn:disabled {
      opacity: .7;
      cursor: default;
    }
  </style>
</head>
<body>

<div class="xero-card">
  <h2 class="card-title">Form Pemesanan</h2>

  <form id="orderForm">

    <!-- TOP GRID -->
    <div class="top-grid">
      <div>
        <label>Customer</label>
        <select id="customer" required></select>
      </div>

      <div>
        <label>Date</label>
        <input type="date" id="date" name="date" required>
      </div>

      <div>
        <label>Invoice Number</label>
        <input id="invnum" name="invnum" placeholder="Auto">
      </div>

      <div>
        <label>Reference</label>
        <input id="reference" name="reference">
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
      <table class="xero-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Product</th>
            <th>Meter</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Price/Qty</th>
            <th>Discount</th>
            <th>Subtotal</th>
            <th>Tax</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="orderBody"></tbody>
      </table>
    </div>

    <button type="button" id="addLine">Add row</button>

    <label style="margin-top:18px;">Catatan:</label>
    <textarea id="catatan" name="catatan"></textarea>

    <!-- SUMMARY -->
    <div class="summary-area">
      <table>
        <tr>
          <td>Subtotal</td>
          <td><input id="subTotal" readonly></td>
        </tr>
        <tr>
          <td>Total tax</td>
          <td><input id="ppn" readonly></td>
        </tr>
        <tr>
          <td><strong>Total</strong></td>
          <td><input id="grandTotal" readonly></td>
        </tr>
      </table>
    </div>

    <div class="submit-box">
      <button type="submit" id="submitBtn">Kirim Order</button>
    </div>
  </form>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="script.js"></script>
</body>
</html>
