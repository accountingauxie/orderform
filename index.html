<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan (Xero Style)</title>

  <!-- UI libraries -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;      /* ⬅ LEBARKAN */
    margin: 40px auto;
  }

  h2 { 
    color: #2b5da4; 
    text-align: center; 
  }

  /* Make inputs not squeezed */
  input, select, textarea {
    font-size: 14px;
  }

  /* TOP SECTION — FULL WIDTH CUSTOMER */
  .top-row {
    display: flex;
    align-items: center;
    gap: 40px;
    width: 100%;
  }

  .top-row div {
    flex: 1;
  }

  .top-row label {
    font-weight: bold;
  }

  /* TABLE XERO STYLE + FULL WIDTH */
  .xero-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 25px;
    table-layout: fixed;   /* ⬅ MEMBUAT LEBAR SESUAI proporsi */
  }

  .xero-table th {
    background: #f7f7f7;
    border-bottom: 2px solid #e5e5e5;
    padding: 12px;
    font-weight: 600;
    color: #444;
    text-align: left;
  }

  .xero-table td {
    padding: 10px;
    border-bottom: 1px solid #ececec;
  }

  .xero-table input, 
  .xero-table select {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    box-sizing: border-box;
  }

  /* COLUMN WIDTHS — WIDER LOOK */
  th:nth-child(1) { width: 40px; }     /* drag */
  th:nth-child(2) { width: 320px; }    /* Item */
  th:nth-child(3) { width: 140px; }    /* Meter */
  th:nth-child(4) { width: 110px; }    /* Qty */
  th:nth-child(5) { width: 160px; }    /* Unit Price */
  th:nth-child(6) { width: 160px; }    /* Price/Qty */
  th:nth-child(7) { width: 180px; }    /* Total */
  th:nth-child(8) { width: 40px; }     /* delete */

  /* DRAG ICON */
  .col-drag {
    cursor: grab;
    font-size: 18px;
    text-align: center;
  }

  /* DELETE BUTTON */
  .delete-btn {
    background: none;
    border: none;
    color: red;
    font-size: 20px;
    cursor: pointer;
  }

  /* ADD ROW */
  #addLine {
    margin-top: 12px;
    background: #e7f1ff;
    border: 1px solid #c7dcff;
    padding: 10px 16px;
    border-radius: 4px;
    color: #2b5da4;
    font-weight: 600;
    cursor: pointer;
  }

  /* SUMMARY BOX — ALIGN RIGHT */
  .summary-box {
    margin-top: 30px;
    width: 350px;
    margin-left: auto;
  }

  .summary-label {
    text-align: right;
    padding-right: 10px;
  }

  .summary-total {
    font-weight: bold;
    font-size: 17px;
  }

  button[type="submit"] {
    margin-top: 20px;
    background: #2b5da4;
    padding: 12px 26px;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    font-size: 14px;
  }
</style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">
  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" name="date" required>
    </div>

    <div style="flex:1">
      <label>Customer</label><br>
      <select id="customer" name="customer" required></select>
    </div>
  </div>

  <table class="xero-table">
    <thead>
      <tr>
        <th class="col-drag"></th>
        <th style="width:220px">Item</th>
        <th style="width:120px">Meter</th>
        <th style="width:80px">Qty</th>
        <th style="width:150px">Unit Price</th>
        <th style="width:150px">Price/Qty</th>
        <th style="width:150px">Total</th>
        <th class="col-delete"></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <div class="summary-box">
    <table>
      <tr><td class="summary-label">Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
      <tr><td class="summary-label">PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
      <tr><td class="summary-label summary-total">Grand Total</td><td><input type="text" id="grandTotal" readonly></td></tr>
    </table>
  </div>

  <label>Catatan tambahan</label><br>
  <textarea name="catatan" rows="3"></textarea><br>

  <button type="submit">Kirim Order</button>
</form>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
