<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan - Xero Style</title>

  <!-- Choices & Sortable -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --xero-blue: #0075c9;
      --xero-blue-dark: #005da0;
      --border: #d6dce1;
      --border-light: #e3e7eb;
      --header-bg: #f0f3f5;
      --text-main: #1f2933;
      --text-muted: #7b8794;
      --page-bg: #f5f7fa;
      --input-radius: 4px;
      --card-radius: 4px;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text-main);
    }

    .top-bar {
      padding: 12px 40px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-bar span.logo-text {
      letter-spacing: 2px;
    }

    .page-wrap {
      padding: 32px 40px;
    }

    .invoice-card {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 24px 24px 28px;
    }

    h2.card-title {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 600;
    }

    /* HEADER GRID */
    .header-grid {
      display: grid;
      grid-template-columns: 2.2fr 1.2fr 1.4fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      border-radius: var(--input-radius);
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      background: #ffffff;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    textarea:focus {
      border-color: var(--xero-blue);
      box-shadow: 0 0 0 1px rgba(0,117,201,0.1);
    }

    /* Choices styling */
    .choices__inner {
      border-radius: var(--input-radius) !important;
      border-color: var(--border) !important;
      min-height: 34px !important;
      padding: 4px 8px !important;
      font-size: 13px;
    }

    .choices__inner.is-focused,
    .choices.is-open .choices__inner {
      border-color: var(--xero-blue) !important;
      box-shadow: 0 0 0 1px rgba(0,117,201,0.1);
    }

    .choices__list--dropdown {
      border-color: var(--border);
      z-index: 9999;
    }

    /* TABLE */
    .items-table-wrap {
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      overflow: hidden;
      margin-top: 12px;
    }

    table.items-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      font-size: 12px;
    }

    .items-table thead {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
    }

    .items-table th,
    .items-table td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border-light);
    }

    .items-table th {
      font-weight: 600;
      color: var(--text-muted);
      text-align: left;
    }

    .items-table th:nth-child(1),
    .items-table td:nth-child(1) { width: 4%; text-align:center; }
    .items-table th:nth-child(2),
    .items-table td:nth-child(2) { width: 10%; }
    .items-table th:nth-child(3),
    .items-table td:nth-child(3) { width: 26%; }
    .items-table th:nth-child(4),
    .items-table td:nth-child(4) { width: 8%; }
    .items-table th:nth-child(5),
    .items-table td:nth-child(5) { width: 8%; }
    .items-table th:nth-child(6),
    .items-table td:nth-child(6) { width: 12%; }
    .items-table th:nth-child(7),
    .items-table td:nth-child(7) { width: 12%; }
    .items-table th:nth-child(8),
    .items-table td:nth-child(8) { width: 12%; }
    .items-table th:nth-child(9),
    .items-table td:nth-child(9) { width: 12%; }
    .items-table th:nth-child(10),
    .items-table td:nth-child(10){ width: 4%; text-align:center;}

    .items-table input[type="number"],
    .items-table input[type="text"],
    .items-table select {
      width: 100%;
      border-radius: var(--input-radius);
      border: 1px solid var(--border-light);
      padding: 6px 6px;
      font-size: 12px;
    }

    .items-table input[type="number"] {
      text-align: right;
    }

    .drag-handle {
      cursor: grab;
      color: #9aa5b1;
      font-size: 16px;
    }

    .delete-row {
      cursor: pointer;
      color: #b4b4b4;
      font-size: 16px;
    }
    .delete-row:hover {
      color: #d64541;
    }

    .add-row-bar {
      padding: 6px 10px;
      background: #f8fafb;
      border-top: 1px solid var(--border-light);
    }

    .add-row-btn {
      border-radius: 3px;
      border: 1px solid var(--border);
      background: #ffffff;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* NOTES + TOTALS */
    .notes-and-totals {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
      margin-top: 14px;
    }

    .notes-box textarea {
      min-height: 110px;
      resize: vertical;
    }

    .totals-box {
      font-size: 13px;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
    }

    .totals-row.total-line {
      margin-top: 4px;
      border-top: 1px solid var(--border);
      padding-top: 6px;
      font-size: 16px;
      font-weight: 600;
    }

    /* FOOTER BUTTON */
    .footer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .btn-primary {
      background: var(--xero-blue);
      border: 1px solid var(--xero-blue);
      color: #ffffff;
      padding: 8px 22px;
      font-size: 13px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--xero-blue-dark);
      border-color: var(--xero-blue-dark);
    }

    /* MODAL */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-box {
      width: 420px;
      background: #ffffff;
      padding: 24px 24px 20px;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    }

    .modal-box h3 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-box label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      display: block;
      margin: 10px 0 4px;
    }

    .modal-actions {
      margin-top: 16px;
      text-align: right;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-cancel {
      background: #e4e7eb;
      border: 1px solid #d2d7dd;
      color: #333;
      padding: 7px 16px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-cancel:hover {
      background: #d5d9de;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span class="logo-text">UXILIUM</span>
    <span style="font-weight:400; font-size:12px; color:#9aa5b1;">Accounting Management Services</span>
  </div>

  <div class="page-wrap">
    <div class="invoice-card">
      <h2 class="card-title">Form Pemesanan</h2>

      <!-- HEADER -->
      <div class="header-grid">
        <div class="field-group">
          <span class="field-label">Contact</span>
          <!-- TANPA OPTION DEFAULT, DIISI DARI JS -->
          <select id="customerSelect"></select>
        </div>

        <div class="field-group">
          <span class="field-label">Issue date</span>
          <input type="date" id="issueDate">
        </div>

        <div class="field-group">
          <span class="field-label">Order number</span>
          <input type="text" id="orderNumber">
        </div>
      </div>

      <!-- TABLE -->
      <div class="items-table-wrap">
        <table class="items-table">
          <thead>
          <tr>
            <th></th>
            <th>Type</th>
            <th>Item</th>
            <th>Meter</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Discount / Unit</th>
            <th>Price/Qty</th>
            <th>Total</th>
            <th></th>
          </tr>
          </thead>
          <tbody id="itemsBody">
          </tbody>
        </table>
        <div class="add-row-bar">
          <button type="button" class="add-row-btn" onclick="addRow()">Add row ▾</button>
        </div>
      </div>

      <!-- NOTES + TOTALS -->
      <div class="notes-and-totals">
        <div class="notes-box">
          <span class="field-label">Catatan:</span>
          <textarea id="notes"></textarea>
        </div>

        <div class="totals-box">
          <div class="totals-row">
            <span>DPP</span>
            <span id="dppDisplay">0.00</span>
          </div>
          <div class="totals-row">
            <span>PPN 11%</span>
            <span id="ppnDisplay">0.00</span>
          </div>
          <div class="totals-row total-line">
            <span>Grand Total</span>
            <span id="grandTotalDisplay">0.00</span>
          </div>
        </div>
      </div>

      <div class="footer-actions">
        <button type="button" class="btn-primary">Approve</button>
      </div>
    </div>
  </div>

  <!-- MODAL ADD CUSTOMER -->
  <div id="modal-bg" class="modal-bg">
    <div class="modal-box">
      <h3>Add New Customer</h3>
      <label for="newCustomerName">Customer Name</label>
      <input type="text" id="newCustomerName" placeholder="Enter customer name">
      <label for="newCustomerPhone">Phone</label>
      <input type="text" id="newCustomerPhone" placeholder="Optional">
      <label for="newCustomerAddress">Address</label>
      <textarea id="newCustomerAddress" rows="3" placeholder="Optional"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" type="button" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" type="button" id="saveCustomerBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- JS LIBS -->
  <script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
  <!-- MAIN SCRIPT -->
  <script src="script.js"></script>
</body>
</html>
