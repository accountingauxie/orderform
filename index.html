<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Pemesanan – EXACT Xero Clone (A)</title>

<link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>
:root {
  --bg: #F5F6F7;
  --card-border: #E3E6E8;
  --header-bg: #F3F4F5;
  --border-color: #D9DCE0;
  --cell-border: #E5E7EB;
  --text-dark: #253858;
  --text-muted: #6B778C;
  --blue: #1F6EF3;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 30px 0;
  background: var(--bg);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text-dark);
}

/* CARD */
.xero-card {
  background: #ffffff;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  max-width: 1300px;
  margin: auto;
  padding: 30px 35px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

/* TITLE */
.card-title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 26px;
}

/* TOP GRID (5 col) */
.top-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  margin-bottom: 28px;
}

label {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
  display: inline-block;
}

input, select {
  width: 100%;
  height: 40px;
  padding: 6px 10px;
  border-radius: 4px;
  border: 1px solid #C4C7CC;
  font-size: 14px;
  background: #ffffff;
}

/* TABLE */
.table-wrapper {
  margin-top: 10px;
}

.xero-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

/* HEADER */
.xero-table thead th {
  background: var(--header-bg);
  border-bottom: 1px solid var(--border-color);
  padding: 10px 8px;
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
  color: #4A4F59;
}

/* ROW CELL */
.xero-table td {
  border-bottom: 1px solid var(--cell-border);
  padding: 8px 8px;
}

.xero-table input {
  width: 100%;
  height: 34px;
  padding: 5px 6px;
  border-radius: 4px;
  border: 1px solid #D2D6DB;
  font-size: 14px;
}

/* COLUMN WIDTHS */
.xero-table th:nth-child(1),
.xero-table td:nth-child(1) { width: 8%; }

.xero-table th:nth-child(2),
.xero-table td:nth-child(2) { width: 23%; }

.xero-table th:nth-child(3),
.xero-table td:nth-child(3) { width: 8%; }

.xero-table th:nth-child(4),
.xero-table td:nth-child(4) { width: 8%; }

.xero-table th:nth-child(5),
.xero-table td:nth-child(5) { width: 10%; }

.xero-table th:nth-child(6),
.xero-table td:nth-child(6) { width: 10%; }

.xero-table th:nth-child(7),
.xero-table td:nth-child(7) { width: 10%; }

.xero-table th:nth-child(8),
.xero-table td:nth-child(8) { width: 9%; }

.xero-table th:nth-child(9),
.xero-table td:nth-child(9) { width: 8%; }

.xero-table th:nth-child(10),
.xero-table td:nth-child(10) { width: 10%; }

.xero-table th:nth-child(11),
.xero-table td:nth-child(11) { width: 30px; }

/* DELETE BUTTON */
.delete-btn {
  background: none;
  border: none;
  color: #B00020;
  font-size: 18px;
  cursor: pointer;
}

/* ADD ROW BUTTON */
#addLine {
  margin-top: 16px;
  background: white;
  border: 1px solid #C5C7D0;
  padding: 8px 14px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  color: #2F3F52;
  cursor: pointer;
}

/* SUMMARY BOX */
.summary-area {
  margin-top: 30px;
  text-align: right;
  margin-right: 10px;
}

.summary-area table {
  width: 260px;
  float: right;
}

.summary-area td {
  padding: 6px;
  font-size: 14px;
}

.summary-area input {
  width: 140px;
  height: 32px;
  border-radius: 4px;
  border: 1px solid #C4C7CC;
  padding: 4px 6px;
  background: #FAFAFA;
  text-align: right;
  font-weight: 600;
}

/* NOTES */
textarea {
  width: 100%;
  min-height: 130px;
  border-radius: 4px;
  border: 1px solid #C4C7CC;
  padding: 10px;
  font-size: 14px;
  resize: vertical;
  margin-top: 10px;
}

/* BUTTON SUBMIT (kanan bawah) */
.submit-box {
  text-align: right;
  margin-top: 22px;
}

button[type="submit"] {
  background: var(--blue);
  color: white;
  border: none;
  border-radius: 4px;
  padding: 9px 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="xero-card">
  <h2 class="card-title">Form Pemesanan</h2>

  <form id="orderForm">

    <!-- TOP GRID -->
    <div class="top-grid">
      <div>
        <label>Customer</label>
        <select id="customer" required></select>
      </div>

      <div>
        <label>Date</label>
        <input type="date" id="date" required>
      </div>

      <div>
        <label>Invoice Number</label>
        <input id="invnum" placeholder="Auto">
      </div>

      <div>
        <label>Reference</label>
        <input id="reference">
      </div>

      <div></div> <!-- empty for alignment -->
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
      <table class="xero-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Product</th>
            <th>Meter</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Price/Qty</th>
            <th>Discount</th>
            <th>Subtotal</th>
            <th>Tax</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="orderBody"></tbody>
      </table>
    </div>

    <button type="button" id="addLine">Add row</button>

    <!-- NOTES -->
    <label style="margin-top:20px;">Catatan:</label>
    <textarea id="catatan"></textarea>

    <!-- SUMMARY -->
    <div class="summary-area">
      <table>
        <tr><td>Subtotal</td><td><input id="subTotal" readonly></td></tr>
        <tr><td>Total tax</td><td><input id="ppn" readonly></td></tr>
        <tr><td><strong>Total</strong></td><td><input id="grandTotal" readonly></td></tr>
      </table>
    </div>

    <!-- SUBMIT -->
    <div class="submit-box">
      <button type="submit">Kirim Order</button>
    </div>

  </form>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

<!-- DEFAULT 3 ROWS -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof addRow === "function") {
    addRow(); addRow(); addRow();
  }
});
</script>

</body>
</html>
