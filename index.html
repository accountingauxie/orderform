<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Form Pemesanan – Xero Style</title>

  <!-- Choices.js -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">

  <style>
    :root {
      --border: #d6dce1;
      --border-light: #e3e7eb;
      --header-bg: #f4f6f8;
      --text-muted: #697386;
      --blue: #1976d2;
      --bg: #f5f7fa;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: "Segoe UI", sans-serif;
    }

    /* ================= TOP BAR ================= */
    .top-bar {
      padding: 14px 36px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
    }

    /* ================= PAGE WRAPPER ================= */
    .page-wrap {
      display: flex;
      justify-content: center;
      padding: 32px 0;
    }

    /* ================= MAIN CARD ================= */
    .invoice-card {
      width: 1380px !important;      /* pixel-perfect width */
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 48px 50px 60px !important; /* EXACT padding */
    }

    h2.card-title {
      margin: 0;
      margin-bottom: 24px;
      font-size: 20px;
      font-weight: 600;
    }

    /* ================= HEADER FORM GRID ================= */
    .header-grid {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1.2fr;
      gap: 22px;
      margin-bottom: 34px !important;   /* EXACT spacing */
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 14px;
    }

    /* ================= TABLE WRAPPER ================= */
    .table-wrapper {
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
      margin-bottom: 40px !important; /* EXACT spacing */
    }

    table.items-table {
      width: 100%;
      border-collapse: collapse;
    }

    .items-table th {
      background: var(--header-bg);
      padding: 10px 8px !important;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      height: 38px !important;        /* EXACT HEADER ROW HEIGHT */
      border-bottom: 1px solid var(--border-light);
    }

    .items-table td {
      padding: 11px 8px !important;
      height: 42px !important;        /* EXACT BODY ROW HEIGHT */
      border-bottom: 1px solid var(--border-light);
    }

    .items-table input,
    .items-table select {
      height: 34px !important;
      padding: 6px 8px !important;
      font-size: 13px !important;
    }

    .drag-handle {
      cursor: grab;
      font-size: 16px;
      color: #777;
    }

    .delete-row {
      cursor: pointer;
      color: #d33;
      font-size: 16px;
    }

    /* ================= ADD ROW BUTTON ================= */
    .add-row-btn {
      margin-top: 12px !important;
      margin-bottom: 40px !important;   /* EXACT spacing table → notes */
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 4px;
      cursor: pointer;
    }

    /* ================= CHOICES.JS FIX ================= */
    .choices__inner {
      min-height: 36px !important;
      padding: 6px 10px !important;
      font-size: 14px !important;
      border-radius: 4px !important;
      border-color: var(--border) !important;
    }

    /* ================= NOTES + TOTALS ================= */
    .notes-and-totals {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 28px !important;     /* EXACT spacing notes → totals */
      margin-top: 0 !important;
    }

    textarea {
      width: 100%;
      height: 170px !important;  /* EXACT notes height */
      border-radius: 4px;
      border: 1px solid var(--border);
      padding: 10px;
      font-size: 13px;
      resize: none;
    }

    .totals-box {
      text-align: right;
      font-size: 14px;
      padding-top: 8px;
      line-height: 1.6rem;
    }

    .total-line {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 700;
    }

    /* ================= APPROVE BUTTON ================= */
    .footer-actions {
      text-align: right;
      margin-top: 44px !important;  /* EXACT spacing totals → button */
    }

    .btn-primary {
      padding: 10px 28px;
      background: var(--blue);
      color: white;
      border-radius: 4px;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
  UXILIUM <span style="font-weight:400;color:#9aa5b1">Accounting Management Services</span>
</div>

<!-- PAGE -->
<div class="page-wrap">
  <div class="invoice-card">

    <h2 class="card-title">Form Pemesanan</h2>

    <!-- HEADER FORM -->
    <div class="header-grid">
      <div>
        <span class="field-label">Contact</span>
        <select id="customerSelect"></select>
      </div>

      <div>
        <span class="field-label">Issue date</span>
        <input type="date" id="issueDate">
      </div>

      <div>
        <span class="field-label">Order number</span>
        <input type="text" id="orderNumber">
      </div>
    </div>

    <!-- TABLE SECTION -->
    <div class="table-wrapper">
      <table class="items-table">
        <thead>
        <tr>
          <th></th>
          <th>Type</th>
          <th>Item</th>
          <th>Meter</th>
          <th>Qty</th>
          <th>Unit Price</th>
          <th>Discount / Unit</th>
          <th>Price/Qty</th>
          <th>Total</th>
          <th></th>
        </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>

    <button class="add-row-btn" onclick="addRow()">Add row ▾</button>

    <!-- NOTES + TOTAL -->
    <div class="notes-and-totals">
      <div>
        <span class="field-label">Catatan:</span>
        <textarea id="notes"></textarea>
      </div>

      <div class="totals-box">
        <div>DPP <span id="dppDisplay">0.00</span></div>
        <div>PPN 11% <span id="ppnDisplay">0.00</span></div>
        <div class="total-line">Grand Total <span id="grandTotalDisplay">0.00</span></div>
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn-primary">Approve</button>
    </div>

  </div>
</div>

<!-- SCRIPT FILE -->
<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="script.js"></script>

</body>
</html>
