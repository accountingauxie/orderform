<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan (Xero Style)</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1400px;
      width: 100%;
      margin: 40px auto;
      padding: 0 40px;
    }

    h2 {
      color: #2b5da4;
      text-align: center;
      margin-bottom: 25px;
    }

    /* Input Styling */
    input, select, textarea {
      font-size: 14px;
      font-family: inherit;
    }

    input[type="text"], input[type="number"], input[type="date"], .choices__inner {
      height: 42px !important;
      min-height: 42px !important;
      line-height: 42px !important;
      border-radius: 6px !important;
      border: 1px solid #d5d9de !important;
      padding: 0 12px !important;
      box-sizing: border-box;
      background: white;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: opacity(60%);
    }

    .top-row {
      display: flex;
      gap: 50px;
      margin-bottom: 20px;
    }

    .top-row div {
      flex: 1;
    }

    .top-row label {
      font-weight: bold;
    }

    /* Table Styling */
    .xero-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-top: 15px;
    }

    .xero-table th {
      background: #f7f7f7;
      padding: 14px 16px !important;
      border-bottom: 2px solid #e5e5e5;
      font-weight: 600;
    }

    .xero-table td {
      padding: 14px 16px !important;
      border-bottom: 1px solid #ececec;
    }

    .col-drag {
      cursor: grab;
      text-align: center;
      width: 35px;
      font-size: 18px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: red;
      font-size: 20px;
      cursor: pointer;
    }

    #addLine {
      margin-top: 12px;
      background: #e7f1ff;
      border: 1px solid #c7dcff;
      padding: 10px 16px;
      border-radius: 4px;
      color: #2b5da4;
      font-weight: 600;
      cursor: pointer;
    }

    /* Summary Box */
    .summary-box {
      width: 420px;
      float: right;
      margin-top: 25px;
    }

    .summary-box input {
      width: 100%;
      height: 32px;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    /* Footer Notes + Button */
    .footer-area {
      margin-top: 55px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
    }

    .footer-left {
      width: 55%;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: vertical;
      font-size: 15px;
    }

    .footer-right {
      width: 40%;
      text-align: right;
    }

    button[type="submit"] {
      background: #2b5da4;
      border: none;
      padding: 12px 22px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    button[type="submit"]:hover {
      background: #1f4988;
    }

    /* Modal Add Customer */
    #modal-bg {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      z-index:2000;
    }

    #modal-box {
      background:white;
      width:350px;
      padding:20px;
      border-radius:8px;
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
    }

    #modal-box input {
      width:100%;
      height:40px;
      margin-top:10px;
      padding:8px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    #modal-box button {
      margin-top:12px;
      width:100%;
      height:40px;
      background:#2b5da4;
      border:none;
      border-radius:6px;
      color:white;
      cursor:pointer;
      font-weight: bold;
    }

    /* Landscape Print */
    @media print {
      @page { size: landscape; }

      #addLine, button, textarea {
        display: none !important;
      }
    }
  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">

  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" name="date" required>
    </div>

    <div>
      <label>Customer</label><br>
      <select id="customer" name="customer" required></select>
    </div>
  </div>

  <!-- TABLE -->
  <table class="xero-table">
    <thead>
      <tr>
        <th></th>
        <th style="width:340px;">Item</th>
        <th style="width:100px;">Meter</th>
        <th style="width:100px;">Qty</th>
        <th style="width:150px;">Unit Price</th>
        <th style="width:150px;">Price/Qty</th>
        <th style="width:170px;">Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <!-- SUMMARY -->
  <div class="summary-box">
    <table>
      <tr><td>Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
      <tr><td>PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
      <tr><td><b>Grand Total</b></td><td><input type="text" id="grandTotal" readonly></td></tr>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="footer-area">

    <div class="footer-left">
      <label>Catatan tambahan</label>
      <textarea name="catatan"></textarea>
    </div>

    <div class="footer-right">
      <button type="submit" id="submitBtn">Kirim Order</button>
    </div>

  </div>

</form>

<!-- Modal Add Customer -->
<div id="modal-bg">
  <div id="modal-box">
    <h3>Tambah Customer Baru</h3>
    <input id="newCustomerName" placeholder="Nama customer..." />
    <button id="saveCustomerBtn">Simpan</button>
  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
