<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan (Xero Style)</title>

  <!-- Choices.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">

  <style>

/* ============================================
   GLOBAL PAGE LAYOUT
============================================ */
body {
  font-family: Arial, sans-serif;
  max-width: 1400px;
  width: 100%;
  margin: 40px auto;
  padding: 0 40px;
}

h2 {
  color: #2b5da4;
  text-align: center;
  margin-bottom: 30px;
}

/* ============================================
   INPUT + SELECT
============================================ */
input, select, textarea {
  font-size: 14px;
  font-family: inherit;
  box-sizing: border-box;
}

input[type="date"],
input[type="number"],
input[type="text"],
.choices__inner {
  height: 42px;
  min-height: 42px;
  border-radius: 6px;
  border: 1px solid #d3d7dc;
  padding: 0 12px;
}

/* prevent minus */
input[type="number"] {
  min: 0;
}

/* ============================================
   TOP ROW
============================================ */
.top-row {
  display: flex;
  justify-content: space-between;
  gap: 40px;
  margin-bottom: 25px;
}
.top-row div {
  flex: 1;
}
.top-row label {
  font-weight: bold;
}

/* ============================================
   TABLE
============================================ */
.xero-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 6px;
}

.xero-table th {
  background: #f7f7f7;
  font-weight: 600;
  text-align: center;
  padding: 12px;
  border-top: 1px solid #e4e7ea;
  border-bottom: 1px solid #e4e7ea;
}

.xero-table td {
  background: white;
  border-top: 1px solid #e4e7ea;
  border-bottom: 1px solid #e4e7ea;
  padding: 12px;
  vertical-align: middle;
}

.xero-table td input,
.xero-table td select,
.xero-table td .choices {
  width: 100%;
}

/* drag handle */
.col-drag {
  width: 20px;
  text-align: center;
  cursor: grab;
  opacity: 0.5;
}

/* delete icon */
.delete-btn {
  background: none;
  border: none;
  color: red;
  font-size: 20px;
  cursor: pointer;
}

/* ============================================
   ADD ROW
============================================ */
#addLine {
  margin-top: 12px;
  background: #e7f1ff;
  border: 1px solid #c7dcff;
  padding: 10px 16px;
  border-radius: 4px;
  color: #2b5da4;
  font-weight: 600;
  cursor: pointer;
}

/* ============================================
   SUMMARY BOX
============================================ */
.summary-box {
  width: 420px;
  float: right;
  margin-top: 25px;
}

.summary-box table {
  width: 100%;
}

.summary-box td:first-child {
  padding-right: 10px;
  font-weight: 500;
}

/* inputs */
.summary-box input {
  height: 34px;
  border-radius: 4px;
  border: 1px solid #ccc;
  padding: 4px 8px;
}

/* SUBMIT BUTTON */
#submitBtn {
  margin-top: 20px;
  float: right;
  background: #2b5da4;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
#submitBtn:hover {
  background: #1f4988;
}

/* ============================================
   FOOTER NOTES
============================================ */
.footer-area {
  clear: both;
  margin-top: 60px;
}

textarea {
  width: 100%;
  min-height: 120px;
  border-radius: 6px;
  border: 1px solid #ccc;
  padding: 12px;
  font-size: 15px;
}

/* ============================================
   CHOICES.JS FIX SAFE
   (NO DAMAGE, NO HEIGHT EXPLOSION)
============================================ */
.choices__inner {
  display: flex;
  align-items: center;
}

.choices__list--single {
  display: flex;
  align-items: center;
  height: 40px;
}

.choices__list--dropdown {
  max-height: 250px;
  overflow-y: auto;
}

/* setiap item */
.choices__list--dropdown .choices__item {
  height: 38px;
  line-height: 38px;
  display: flex;
  align-items: center;
  padding-left: 12px;
}

  </style>
</head>

<body>

<h2>Form Pemesanan</h2>

<form id="orderForm">

  <!-- TOP -->
  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" name="date" required>
    </div>

    <div>
      <label>Customer</label><br>
      <select id="customer" name="customer" required></select>
    </div>
  </div>

  <!-- TABLE -->
  <table class="xero-table">
    <thead>
      <tr>
        <th></th>
        <th>Item</th>
        <th>Meter</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Price/Qty</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <!-- SUMMARY -->
  <div class="summary-box">
    <table>
      <tr><td>Sub Total</td><td><input id="subTotal" readonly></td></tr>
      <tr><td>PPN 11%</td><td><input id="ppn" readonly></td></tr>
      <tr><td><b>Grand Total</b></td><td><input id="grandTotal" readonly></td></tr>
    </table>

    <button type="submit" id="submitBtn">Kirim Order</button>
  </div>

  <!-- NOTES -->
  <div class="footer-area">
    <label>Catatan tambahan</label>
    <textarea name="catatan"></textarea>
  </div>

</form>

<!-- MODAL -->
<div id="modal-bg" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:9999;
">
  <div style="
    width:300px;
    background:white;
    padding:20px;
    margin:150px auto;
    border-radius:8px;
  ">
    <h3>Tambah Customer Baru</h3>
    <input id="newCustomerName" placeholder="Nama customer..." style="width:100%; margin-bottom:15px;">
    <button id="saveCustomerBtn" style="
      width:100%;
      background:#2b5da4;
      color:white;
      padding:10px;
      border:none;
      border-radius:6px;
      cursor:pointer;
    ">Simpan</button>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
