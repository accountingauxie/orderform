<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Form Pemesanan</title>

<link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>
:root {
  --blue: #1f6ef3;
  --border: #d8dce2;
  --bg: #f5f7fa;
  --text: #2b3d55;
}

body {
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  margin: 0;
  padding: 40px 0;
}

.container {
  max-width: 1280px;
  margin: auto;
  background: #fff;
  padding: 35px 40px;
  border-radius: 12px;
  border: 1px solid #e2e5ea;
}

h2 {
  font-size: 24px;
  margin-bottom: 25px;
  color: var(--text);
}

label {
  font-size: 12px;
  font-weight: 600;
  color: #444;
  display: block;
  margin-bottom: 6px;
}

.top-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr;
  gap: 22px;
  margin-bottom: 28px;
}

input, select, textarea {
  width: 100%;
  height: 40px;
  padding: 7px 10px;
  border: 1px solid #cfd3d8;
  border-radius: 6px;
  font-size: 14px;
}

textarea {
  height: 150px;
  resize: vertical;
  padding: 12px;
}

.table-wrap {
  margin-top: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead th {
  text-align: left;
  font-size: 13px;
  background: #f0f2f5;
  padding: 10px;
  border-bottom: 1px solid var(--border);
}

tbody td {
  border-bottom: 1px solid #eef0f2;
  padding: 8px;
}

.delete-btn {
  background: none;
  border: none;
  font-size: 18px;
  color: red;
  cursor: pointer;
}

#addRow {
  background: white;
  border: 1px solid var(--border);
  padding: 7px 12px;
  font-size: 13px;
  border-radius: 6px;
  cursor: pointer;
}

.summary {
  margin-top: 30px;
  text-align: right;
  padding-right: 10px;
}

.summary div {
  font-size: 14px;
  margin-bottom: 5px;
}

.summary strong {
  font-size: 17px;
}

button[type="submit"] {
  background: var(--blue);
  color: white;
  border: none;
  padding: 10px 24px;
  font-size: 15px;
  border-radius: 6px;
  cursor: pointer;
  float: right;
  margin-top: 15px;
}
</style>
</head>

<body>
<div class="container">
<h2>Form Pemesanan</h2>

<form id="orderForm">

<div class="top-grid">
  <div>
    <label>Customer</label>
    <select id="customer" name="customer" required></select>
  </div>

  <div>
    <label>Date</label>
    <input type="date" id="date" name="date" required />
  </div>

  <div>
    <label>Order Number</label>
    <input type="text" id="orderID" name="orderID" readonly />
  </div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th style="width:40px;"></th>
  <th>Product</th>
  <th>Meter</th>
  <th>Qty</th>
  <th>Unit Price</th>
  <th>Discount/Unit</th>
  <th>Price/Qty</th>
  <th>Total</th>
  <th></th>
</tr>
</thead>
<tbody id="orderBody"></tbody>
</table>
</div>

<button type="button" id="addRow">Add row</button>

<label style="margin-top:25px;">Catatan</label>
<textarea id="notes" name="notes"></textarea>

<div class="summary">
  <div>DPP: <span id="dpp">Rp 0</span></div>
  <div>PPN 11%: <span id="ppn">Rp 0</span></div>
  <strong>Grand Total: <span id="grandTotal">Rp 0</span></strong>
</div>

<button type="submit" id="submitBtn">Kirim Order</button>

</form>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
