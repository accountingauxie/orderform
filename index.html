<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Form Pemesanan</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">

  <style>
    :root {
      --border: #d6dce1;
      --border-light: #e3e7eb;
      --header-bg: #f4f6f8;
      --text-muted: #697386;
      --blue: #1976d2;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      font-family: "Segoe UI", sans-serif;
    }

    /* HEADER TOP */
    .top-bar {
      padding: 14px 36px;
      background: #ffffff;
      border-bottom: 1px solid #e3e7eb;
      display: flex;
      align-items: center;
      font-weight: 600;
      font-size: 15px;
      gap: 10px;
    }

    /* PAGE WRAP */
    .page-wrap {
      display: flex;
      justify-content: center;
      padding: 32px 0;
    }

    /* CARD */
    .invoice-card {
      width: 1280px;        /* 🔥 FIX UTAMA */
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 40px;  /* 🔥 mengikuti screenshot */
    }

    h2.card-title {
      margin: 0 0 24px;
      font-size: 20px;
      font-weight: 600;
    }

    /* FORM GRID */
    .header-grid {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1.2fr;
      gap: 22px;
      margin-bottom: 26px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    input, select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 14px;
    }

    /* TABLE WRAPPER */
    .table-wrapper {
      border: 1px solid var(--border);
      background: white;
      border-radius: 6px;
      overflow: hidden;
    }

    table.items-table {
      width: 100%;
      border-collapse: collapse;
    }

    .items-table th {
      background: var(--header-bg);
      padding: 10px 8px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-light);
    }

    .items-table td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border-light);
    }

    .items-table input,
    .items-table select {
      height: 34px;
      font-size: 13px;
      padding: 5px 7px;
    }

    .drag-handle {
      cursor: grab;
      font-size: 16px;
      color: #777;
    }

    .delete-row {
      font-size: 16px;
      color: #d33;
      cursor: pointer;
    }

    .add-row-btn {
      margin-top: 12px;
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 4px;
      cursor: pointer;
    }

    /* CHOICES FIX */
    .choices__inner {
      min-height: 36px !important;
      padding: 5px 8px !important;
      border-radius: 4px !important;
      border-color: var(--border) !important;
      font-size: 14px !important;
    }

    /* NOTES + TOTAL */
    .notes-and-totals {
      margin-top: 26px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 10px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .totals-box {
      text-align: right;
      font-size: 14px;
      padding-right: 6px;
      line-height: 1.6rem;
    }

    .total-line {
      font-size: 18px;
      font-weight: 700;
      margin-top: 6px;
    }

    /* BUTTON */
    .footer-actions {
      text-align: right;
      margin-top: 30px;
    }

    .btn-primary {
      padding: 10px 28px;
      background: var(--blue);
      color: white;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="top-bar">
  UXILIUM <span style="font-weight:400;color:#9aa5b1">Accounting Management Services</span>
</div>

<div class="page-wrap">
  <div class="invoice-card">

    <h2 class="card-title">Form Pemesanan</h2>

    <div class="header-grid">
      <div>
        <span class="field-label">Contact</span>
        <select id="customerSelect"></select>
      </div>

      <div>
        <span class="field-label">Issue date</span>
        <input type="date" id="issueDate">
      </div>

      <div>
        <span class="field-label">Order number</span>
        <input type="text" id="orderNumber">
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
      <table class="items-table">
        <thead>
        <tr>
          <th></th>
          <th>Type</th>
          <th>Item</th>
          <th>Meter</th>
          <th>Qty</th>
          <th>Unit Price</th>
          <th>Discount / Unit</th>
          <th>Price/Qty</th>
          <th>Total</th>
          <th></th>
        </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>

    <button class="add-row-btn" onclick="addRow()">Add row ▾</button>

    <div class="notes-and-totals">
      <div>
        <span class="field-label">Catatan:</span>
        <textarea id="notes"></textarea>
      </div>

      <div class="totals-box">
        <div>DPP 0.00</div>
        <div>PPN 11% 0.00</div>
        <div class="total-line">Grand Total 0.00</div>
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn-primary">Approve</button>
    </div>

  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="script.js"></script>

</body>
</html>
