<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<title>Form Pemesanan — Xero Ultra Modern</title>

<link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>
/* ============================================
   GLOBAL PAGE LAYOUT
============================================ */
body {
  font-family: Aptos, sans-serif;
  max-width: 1400px;
  width: 100%;
  margin: 40px auto;
  padding: 0 40px;
  background: #f5f7fa;
}

h2 {
  color: #1e395b;
  text-align: center;
  margin-bottom: 5px;
}

.subheader {
  text-align: center;
  color: #7b8794;
  margin-bottom: 25px;
  font-size: 14px;
}

/* ============================================
   INPUTS
============================================ */
input, select, textarea {
  font-size: 14px;
  font-family: inherit;
}

input[type="text"], input[type="number"], input[type="date"], .choices__inner {
  height: 42px !important;
  min-height: 42px !important;
  border-radius: 6px !important;
  border: 1px solid #d3d7dc !important;
  padding: 0 12px !important;
  background: white;
  box-sizing: border-box;
}

/* date picker icon */
input[type="date"]::-webkit-calendar-picker-indicator {
  cursor: pointer;
  filter: opacity(65%);
}

/* ============================================
   TOP SECTION
============================================ */
.top-row {
  display: flex;
  gap: 50px;
  margin-bottom: 20px;
}

.top-row div { flex: 1; }
.top-row label { font-weight: bold; }

/* ============================================
   XERO ULTRA MODERN TABLE — COLUMN GAP
============================================ */
.table-wrapper {
  width: 100%;
  overflow-x: auto;
  padding-bottom: 20px;
}

.xero-table {
  width: 100%;
  border-collapse: separate !important;
  border-spacing: 16px 0;   /* COLUMN GAP → 16px */
}

.xero-table thead th {
  background: #eef1f4;
  padding: 14px 16px;
  font-weight: 600;
  font-size: 14px;
  color: #455468;
  border-radius: 6px;
  white-space: nowrap;
  text-align: left;
}

/* ROWS */
.xero-table tbody td {
  background: white;
  padding: 12px 14px;
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  position: relative;
}

/* drag handle */
.col-drag {
  width: 30px !important;
  text-align: center;
  color: #a0a9b4;
  cursor: grab;
  font-size: 18px;
}

/* delete button */
.delete-btn {
  font-size: 18px;
  color: #d9534f;
  background: none;
  border: none;
  cursor: pointer;
}

/* Inputs inside table */
.xero-table input {
  width: 100%;
  box-sizing: border-box;
  text-align: left;
}

/* Ensure dropdown is not cut */
.choices {
  width: 100%;
  z-index: 50 !important;
}

.choices__list--dropdown,
.choices__list[aria-expanded] {
  max-height: 220px;
  overflow-y: auto;
  z-index: 99999 !important;
  position: absolute !important;
  width: 100% !important;
}

/* ============================================
   ADD ROW BUTTON
============================================ */
#addLine {
  margin-top: 12px;
  background: #e2eaff;
  border: 1px solid #c4d3ff;
  padding: 10px 16px;
  border-radius: 6px;
  color: #2457c5;
  font-weight: 600;
  cursor: pointer;
}

/* ============================================
   SUMMARY BOX
============================================ */
.summary-box {
  width: 420px;
  float: right;
  margin-top: 25px;
  background: #ffffff;
  padding: 18px 20px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.07);
}

.summary-box table {
  width: 100%;
}

.summary-box td {
  padding: 6px 0;
  color: #3b4856;
  font-size: 14px;
}

.summary-box input {
  width: 100%;
  height: 34px;
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #d1d7de;
  text-align: right;
  font-weight: 600;
  background: #fafbfc;
}

/* ============================================
   FOOTER AREA
============================================ */
.footer-area {
  margin-top: 55px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 40px;
}

.footer-left { width: 55%; }

textarea {
  width: 100%;
  min-height: 140px;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  resize: vertical;
  font-size: 15px;
}

.footer-right {
  width: 40%;
  text-align: right;
}

button[type="submit"] {
  background: #1f6ef3;
  border: none;
  padding: 12px 24px;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
}

button[type="submit"]:hover {
  background: #1558c2;
}

/* ============================================
   MOBILE FIX
============================================ */
@media (max-width: 768px) {
  body { padding: 0 10px; }
  .top-row { flex-direction: column; gap: 12px; }
  .summary-box { width: 100%; float: none; }
  .footer-area { flex-direction: column; }
  .footer-left, .footer-right { width: 100%; }
  button[type="submit"] { width: 100%; }
}

/* ============================================
   PRINT
============================================ */
@media print {
  @page { size: landscape; }
  #addLine, button, textarea { display: none !important; }
}
</style>
</head>

<body>

<h2>Form Pemesanan</h2>
<div class="subheader">Xero Ultra Modern — Pure Flat Version</div>

<p id="result"></p>

<form id="orderForm">

  <!-- TOP ROW -->
  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" required>
    </div>

    <div>
      <label>Customer</label><br>
      <select id="customer" required></select>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table class="xero-table">
      <thead>
        <tr>
          <th style="width:30px;"></th>
          <th style="min-width:260px;">Product</th>
          <th style="min-width:90px;">Meter</th>
          <th style="min-width:80px;">Qty</th>
          <th style="min-width:120px;">Unit Price</th>
          <th style="min-width:120px;">Price/Qty</th>
          <th style="min-width:140px;">Total</th>
          <th style="width:40px;"></th>
        </tr>
      </thead>
      <tbody id="orderBody"></tbody>
    </table>
  </div>

  <button type="button" id="addLine">+ Add row</button>

  <!-- SUMMARY -->
  <div class="summary-box">
    <table>
      <tr><td>Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
      <tr><td>PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
      <tr><td><b>Grand Total</b></td><td><input type="text" id="grandTotal" readonly></td></tr>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="footer-area">
    <div class="footer-left">
      <label>Catatan tambahan</label>
      <textarea id="catatan"></textarea>
    </div>

    <div class="footer-right">
      <button type="submit">Kirim Order</button>
    </div>
  </div>

</form>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
