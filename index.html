<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan - Xero Style</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">

  <style>
    :root {
      --xero-blue: #0075c9;
      --border: #d6dce1;
      --border-light: #e5e9f2;
      --header-bg: #f5f7fa;
      --text-main: #1f2933;
      --text-muted: #7b8794;
      --input-radius: 6px;
    }

    * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }

    body { margin: 0; background: #ffffff; }

    /* ========================= PAGE WRAPPER ========================= */
    .page-wrap {
      padding: 40px;
    }

    /* ========================= CARD ========================= */
    .invoice-card {
      width: 96%;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px 32px 40px;
    }

    h2.card-title {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 22px;
      font-weight: 600;
    }

    /* ========================= HEADER GRID ========================= */
    .header-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    input, select {
      width: 100%;
      height: 36px;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    /* ========================= TABLE ========================= */
    table.items-table {
      width: 100%;
      border-collapse: collapse;
    }

    .items-table th {
      background: var(--header-bg);
      font-size: 13px;
      padding: 10px 8px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-light);
      text-align: left;
    }

    .items-table td {
      padding: 8px 8px;
      border-bottom: 1px solid var(--border-light);
    }

    .items-table input,
    .items-table select {
      height: 34px;
      font-size: 13px;
      padding: 6px 8px;
    }

    .drag-handle {
      cursor: grab;
      font-size: 16px;
      color: #a0a0a0;
    }

    .delete-row {
      color: #d33;
      cursor: pointer;
      font-size: 15px;
      padding-left: 4px;
    }

    .add-row-bar {
      margin-top: 10px;
    }

    .add-row-btn {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
    }

    /* ========================= CHOICES FIX ========================= */
    .choices__inner {
      min-height: 36px !important;
      padding: 4px 8px !important;
      font-size: 13px !important;
      border-radius: 6px !important;
      border-color: var(--border) !important;
    }

    .choices__list--dropdown .choices__item {
      padding: 6px 10px !important;
      font-size: 13px !important;
    }

    /* ========================= NOTES + TOTALS ========================= */
    .notes-and-totals {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
      margin-top: 32px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      font-size: 14px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .totals-box {
      text-align: right;
      font-size: 14px;
      line-height: 1.7rem;
      padding-top: 10px;
    }

    .total-line {
      font-size: 18px;
      font-weight: 600;
      margin-top: 6px;
    }

    /* ========================= BUTTON ========================= */
    .footer-actions {
      margin-top: 32px;
      text-align: right;
    }

    .btn-primary {
      padding: 10px 28px;
      background: var(--xero-blue);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #005da0;
    }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="invoice-card">

    <h2 class="card-title">Form Pemesanan</h2>

    <!-- HEADER -->
    <div class="header-grid">
      <div>
        <span class="field-label">Contact</span>
        <select id="customerSelect"></select>
      </div>

      <div>
        <span class="field-label">Issue date</span>
        <input type="date" id="issueDate">
      </div>

      <div>
        <span class="field-label">Order number</span>
        <input type="text" id="orderNumber">
      </div>
    </div>

    <!-- TABLE -->
    <table class="items-table">
      <thead>
      <tr>
        <th></th>
        <th>Type</th>
        <th>Item</th>
        <th>Meter</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Discount / Unit</th>
        <th>Price/Qty</th>
        <th>Total</th>
        <th></th>
      </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <div class="add-row-bar">
      <button class="add-row-btn" onclick="addRow()">Add row ▾</button>
    </div>

    <!-- NOTES + TOTAL -->
    <div class="notes-and-totals">

      <div>
        <span class="field-label">Catatan:</span>
        <textarea id="notes"></textarea>
      </div>

      <div class="totals-box">
        <div>DPP <span id="dppDisplay">0.00</span></div>
        <div>PPN 11% <span id="ppnDisplay">0.00</span></div>
        <div class="total-line">Grand Total <span id="grandTotalDisplay">0.00</span></div>
      </div>

    </div>

    <div class="footer-actions">
      <button class="btn-primary">Approve</button>
    </div>

  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="script.js"></script>

</body>
</html>
