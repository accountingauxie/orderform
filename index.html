<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan Sukses Jaya</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>

/* =============================
   GLOBAL FORM LAYOUT
============================= */
body {
  font-family: Arial, sans-serif;
  max-width: 1400px;
  margin: 40px auto;
  padding: 0 40px;
}

/* Title */
h2 {
  text-align: center;
  color: #2b5da4;
  margin-bottom: 30px;
}

/* =============================
   TOP SECTION
============================= */
.top-row {
  display: flex;
  gap: 50px;
  margin-bottom: 40px;
}

.top-row div {
  flex: 1;
}

.top-row label {
  font-weight: bold;
  margin-bottom: 10px;
  display: inline-block;
}

/* Inputs */
input, select, textarea {
  font-size: 14px;
  font-family: inherit;
}
input[type="text"], input[type="number"], input[type="date"], .choices__inner {
  height: 42px !important;
  border-radius: 6px;
  border: 1px solid #d3d7dc;
  padding: 0 12px;
  box-sizing: border-box;
}

/* Make choices dropdown text centered */
.choices__inner {
  display: flex !important;
  align-items: center !important;
}

/* =============================
   TABLE
============================= */
.xero-table {
  width: 100%;
  border-collapse: separate !important;
  border-spacing: 0 6px;
}

.xero-table th {
  background: #f7f7f7;
  padding: 14px;
  border-top: 1px solid #e2e3e7;
  border-bottom: 1px solid #e2e3e7;
  white-space: nowrap;
}

.xero-table td {
  background: #ffffff;
  padding: 14px;
  border-top: 1px solid #e2e3e7;
  border-bottom: 1px solid #e2e3e7;
  vertical-align: middle;
}

.xero-table td + td,
.xero-table th + th {
  border-left: 1px solid #f0f0f0;
}

.col-drag {
  width: 18px !important;
  text-align: center;
  cursor: grab;
  opacity: 0.5;
  padding: 0 !important;
}

.delete-btn {
  background: none;
  border: none;
  color: red;
  font-size: 20px;
  cursor: pointer;
}

.xero-table input {
  width: 100%;
}

/* Add row button */
#addLine {
  margin-top: 10px;
  background: #e7f1ff;
  border: 1px solid #c7dcff;
  padding: 10px 16px;
  border-radius: 4px;
  color: #2b5da4;
  cursor: pointer;
}

/* =============================
   SUMMARY RIGHT SIDE (NEW STRUCTURE)
============================= */

.summary-container {
  margin-top: 20px;
  display: flex;
  justify-content: flex-end;
}

.summary-box {
  width: 170px;
  margin-right: 10px;
}

.summary-box table {
  width: 100%;
}

.summary-box td:first-child {
  text-align: left;
}
.summary-box td:last-child {
  text-align: right;
}

/* =============================
   BOTTOM FOOTER
============================= */

.footer-area {
  margin-top: 40px;
  display: flex;
  justify-content: space-between;
}

.footer-left {
  width: 55%;
}

textarea {
  width: 100%;
  min-height: 120px;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

/* Submit button aligned with TOTAL column */
.footer-right {
  width: 170px;
}

#submitBtn {
  width: 100%;
  padding: 12px;
  background: #2b5da4;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  margin-top: 20px;
}

/* =============================
   MODAL FIX
============================= */

#modal-bg {
  display:none; /* FIX: hide modal */
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 9999;
}

#modal-box {
  background: white;
  width: 350px;
  padding: 20px;
  border-radius: 8px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

/* =============================
   RESPONSIVE
============================= */
@media (max-width: 768px) {
  body { padding: 0 10px; }

  .top-row {
    flex-direction: column;
  }

  .footer-area {
    flex-direction: column;
  }

  .footer-right,
  .footer-left {
    width: 100%;
  }

  #submitBtn {
    width: 100%;
  }
}

  </style>
</head>

<body>

<h2>Form Pemesanan</h2>

<form id="orderForm">

  <!-- TOP AREA -->
  <div class="top-row">
    <div>
      <label>Date</label>
      <input type="date" id="date" required>
    </div>
    <div>
      <label>Customer</label>
      <select id="customer" required></select>
    </div>
  </div>

  <!-- TABLE -->
  <table class="xero-table">
    <thead>
      <tr>
        <th style="width:25px;"></th>
        <th style="min-width:260px;">Item</th>
        <th style="min-width:90px;">Meter</th>
        <th style="min-width:80px;">Qty</th>
        <th style="min-width:120px;">Unit Price</th>
        <th style="min-width:120px;">Price/Qty</th>
        <th style="min-width:140px;">Total</th>
        <th style="width:40px;"></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <!-- SUMMARY (Proper alignment) -->
  <div class="summary-container">
    <div class="summary-box">
      <table>
        <tr><td>Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
        <tr><td>PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
        <tr><td><b>Grand Total</b></td><td><input type="text" id="grandTotal" readonly></td></tr>
      </table>
    </div>
  </div>

  <!-- FOOTER NOTES + BUTTON -->
  <div class="footer-area">
    <div class="footer-left">
      <label>Catatan tambahan</label>
      <textarea name="catatan"></textarea>
    </div>

    <div class="footer-right">
      <button type="submit" id="submitBtn">Kirim Order</button>
    </div>
  </div>

</form>

<!-- MODAL -->
<div id="modal-bg">
  <div id="modal-box">
    <h3>Tambah Customer Baru</h3>
    <input id="newCustomerName" placeholder="Nama customer..." />
    <button id="saveCustomerBtn">Simpan</button>
  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
