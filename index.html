<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
/* ================= GLOBAL ================= */
body {
  font-family: Arial, sans-serif;
  max-width: 1400px;
  margin: 40px auto;
  padding: 0 40px;
}

h2 {
  text-align: center;
  color: #2b5da4;
  margin-bottom: 30px;
}

label {
  font-weight: bold;
  margin-bottom: 6px;
  display: inline-block;
}

input, select, textarea {
  font-size: 14px;
  font-family: inherit;
}

input[type="text"],
input[type="number"],
input[type="date"],
.choices__inner {
  height: 42px !important;
  border-radius: 6px;
  border: 1px solid #d3d7dc;
  padding: 0 12px;
  box-sizing: border-box;
}

/* Choices text center */
.choices__inner {
  display: flex !important;
  align-items: center !important;
}

/* ============== TOP ROW ============== */
.top-row {
  display: flex;
  gap: 60px;
  margin-bottom: 30px;
}

.top-row div {
  flex: 1;
}

/* ============== TABLE ============== */
.table-wrapper {
  width: 100%;
}

.xero-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 6px;
}

.xero-table th {
  background: #f7f7f7;
  padding: 14px;
  border-top: 1px solid #ddd;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

.xero-table td {
  padding: 14px;
  background: #fff;
  border-top: 1px solid #eee;
  border-bottom: 1px solid #eee;
  vertical-align: middle;
}

.xero-table td + td,
.xero-table th + th {
  border-left: 1px solid #f0f0f0;
}

/* DRAG */
.col-drag {
  width: 30px;
  cursor: grab;
  opacity: 0.5;
  text-align: center;
}

/* DELETE */
.delete-btn {
  background: none;
  border: none;
  color: red;
  font-size: 20px;
  cursor: pointer;
}

/* Kolom lebar: hanya atur yang perlu */
.xero-table th:nth-child(3),
.xero-table td:nth-child(3) {   /* Meter */
  width: 80px;
}

.xero-table th:nth-child(4),
.xero-table td:nth-child(4) {   /* Qty */
  width: 70px;
}

.xero-table th:nth-child(8),
.xero-table td:nth-child(8) {   /* delete */
  width: 40px;
}

/* Add row */
#addLine {
  margin-top: 10px;
  padding: 10px 16px;
  background: #e7f1ff;
  border: 1px solid #c7dcff;
  border-radius: 4px;
  color: #2b5da4;
  font-weight: 600;
}

/* ============== SUMMARY & BUTTON (DI BAWAH TABEL) ============== */
.summary-row {
  margin-top: 20px;
  display: flex;
  justify-content: flex-end;
}

.summary-box {
  width: 230px;
}

.summary-box table {
  width: 100%;
}

.summary-box td:first-child { text-align: left; }
.summary-box td:last-child { text-align: right; }

.summary-box input {
  width: 100%;
  height: 38px;
  border-radius: 6px;
  border: 1px solid #ccc;
  padding: 0 10px;
}

.actions-row {
  margin-top: 12px;
  display: flex;
  justify-content: flex-end;
}

#submitBtn {
  width: 230px;
  padding: 12px;
  background: #2b5da4;
  border: none;
  border-radius: 6px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#submitBtn:hover {
  background: #1f4c89;
}

/* ============== NOTES ============== */
.notes-section {
  margin-top: 40px;
}

textarea {
  width: 100%;
  min-height: 140px;
  border-radius: 6px;
  border: 1px solid #ccc;
  padding: 12px;
}

/* ============== MODAL ============== */
#modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 9999;
}

#modal-box {
  width: 350px;
  padding: 20px;
  background: #fff;
  border-radius: 8px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

  </style>
</head>

<body>

<h2>Form Pemesanan</h2>

<form id="orderForm">

  <!-- TOP -->
  <div class="top-row">
    <div>
      <label>Date</label>
      <input type="date" id="date" required>
    </div>
    <div>
      <label>Customer</label>
      <select id="customer" required></select>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">

    <table class="xero-table">
      <thead>
        <tr>
          <th></th>
          <th>Item</th>
          <th>Meter</th>
          <th>Qty</th>
          <th>Unit Price</th>
          <th>Price/Qty</th>
          <th>Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="orderBody"></tbody>
    </table>

    <button id="addLine" type="button">+ Add row</button>

    <!-- SUMMARY DI BAWAH TABEL -->
    <div class="summary-row">
      <div class="summary-box">
        <table>
          <tr><td>Sub Total</td><td><input id="subTotal" readonly></td></tr>
          <tr><td>PPN 11%</td><td><input id="ppn" readonly></td></tr>
          <tr><td><b>Grand Total</b></td><td><input id="grandTotal" readonly></td></tr>
        </table>
      </div>
    </div>

    <!-- BUTTON DI BAWAH SUMMARY -->
    <div class="actions-row">
      <button id="submitBtn" type="submit">Kirim Order</button>
    </div>

  </div>

  <!-- CATATAN -->
  <div class="notes-section">
    <label>Catatan tambahan</label>
    <textarea name="catatan"></textarea>
  </div>

</form>

<!-- MODAL CUSTOMER -->
<div id="modal-bg">
  <div id="modal-box">
    <h3>Tambah Customer Baru</h3>
    <input id="newCustomerName" placeholder="Nama customer..." />
    <button id="saveCustomerBtn">Simpan</button>
  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
