<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Order Form</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
    }
    h2 {
      color: #2b5da4;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #f3f3f3;
    }
    .delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    #addLine {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 14px;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 10px;
    }
    #addLine:hover {
      background: #1e7e34;
    }
    button[type="submit"] {
      background: #2b5da4;
      padding: 10px 15px;
      border-radius: 5px;
      color: white;
      border: none;
      cursor: pointer;
    }
    .summary-box {
      margin-top: 20px;
      width: 300px;
      margin-left: auto;
    }
    .summary-box table {
      width: 100%;
      border: none;
    }
    .summary-box td {
      padding: 6px;
      font-size: 14px;
    }
    .summary-label {
      text-align: right;
    }
    .summary-total {
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">
  <label>Date</label>
  <input type="date" id="date" name="date" required>

  <label>Customer</label>
  <select name="customer" id="customer" required></select>

  <table id="orderTable">
    <thead>
      <tr>
        <th>No</th>
        <th>Product</th>
        <th>Meter</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Price/Qty</th>
        <th>Total Price</th>
        <th>Delete</th>
      </tr>
    </thead>

    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Tambah Baris</button>

  <div class="summary-box">
    <table>
      <tr>
        <td class="summary-label">Sub Total</td>
        <td><input type="number" id="subTotal" name="subTotal" readonly></td>
      </tr>
      <tr>
        <td class="summary-label">PPN 11%</td>
        <td><input type="number" id="ppn" name="ppn" readonly></td>
      </tr>
      <tr>
        <td class="summary-label summary-total">Grand Total</td>
        <td><input type="number" id="grandTotal" name="grandTotal" readonly></td>
      </tr>
    </table>
  </div>

  <label>Catatan tambahan:</label>
  <textarea name="catatan" rows="3"></textarea>

  <button type="submit">Kirim Order</button>
</form>


<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<script>
const baseURL =
 "https://script.google.com/macros/s/AKfycbxb7ZrEd4D0DJG5JEqV0U6FepmRlquL2MeMCL-uwY1_CrmcxAqt7rXo8bwdB4JIc5oO/exec";

let choiceCustomer;
let productDropdowns = [];
let productList = [];

const orderBody = document.getElementById("orderBody");
const result = document.getElementById("result");

// Set default date
document.getElementById("date").value = new Date().toISOString().split("T")[0];

// ==================== LOAD DATA ====================
async function loadDropdowns() {
  const res = await fetch(`${baseURL}?action=getdata`);
  const data = await res.json();
  productList = data.products;

  choiceCustomer = new Choices("#customer", { shouldSort: false });
  choiceCustomer.setChoices(
    data.customers.map(v => ({ value: v, label: v })),
    "value", "label", true
  );

  // Default 3 rows
  addLine(); addLine(); addLine();
}

// ==================== ADD LINE ====================
function addLine() {
  const rowIndex = orderBody.children.length + 1;

  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="lineNo">${rowIndex}</td>
    <td><select class="product-select" name="product_${rowIndex}"></select></td>
    <td><input type="number" step="0.01" class="meter" name="meter_${rowIndex}"></td>
    <td><input type="number" step="1" class="qty" name="qty_${rowIndex}"></td>
    <td><input type="number" readonly class="unitPrice" name="unit_${rowIndex}"></td>
    <td><input type="number" readonly class="pricePerQty" name="ppq_${rowIndex}"></td>
    <td><input type="number" readonly class="totalPrice" name="total_${rowIndex}"></td>
    <td><button type="button" class="delete-btn">❌</button></td>
  `;

  orderBody.appendChild(tr);

  // Attach dropdown
  const select = tr.querySelector(".product-select");
  const choice = new Choices(select, { searchEnabled: true, shouldSort: false });
  productDropdowns.push(choice);
  choice.setChoices(productList.map(v => ({ value: v, label: v })), "value", "label", true);

  // Event listeners
  select.addEventListener("change", () => updatePrice(tr));
  tr.querySelector(".meter").addEventListener("input", () => calculateRow(tr));
  tr.querySelector(".qty").addEventListener("input", () => calculateRow(tr));
  tr.querySelector(".delete-btn").addEventListener("click", () => deleteRow(tr));
}

// ==================== DELETE ROW ====================
function deleteRow(tr) {
  tr.remove();
  updateLineNumbers();
  calculateSummary();
}

// ==================== UPDATE LINE NUMBERS ====================
function updateLineNumbers() {
  [...orderBody.children].forEach((row, idx) => {
    row.querySelector(".lineNo").textContent = idx + 1;
  });
}

// ==================== SORTABLE DRAG ====================
Sortable.create(orderBody, {
  handle: ".lineNo",
  animation: 150,
  onEnd: updateLineNumbers
});

// ==================== LOOKUP PRICE ====================
async function updatePrice(tr) {
  const product = tr.querySelector(".product-select").value;
  const unitInput = tr.querySelector(".unitPrice");

  const res = await fetch(`${baseURL}?action=getprice&product=${encodeURIComponent(product)}`);
  const price = parseFloat((await res.text()).replace(/[^\d.-]/g, ""));

  unitInput.value = isNaN(price) ? "" : price.toFixed(2);
  calculateRow(tr);
}

// ==================== CALCULATE ROW ====================
function calculateRow(tr) {
  const meter = parseFloat(tr.querySelector(".meter").value) || 0;
  const qty = parseFloat(tr.querySelector(".qty").value) || 0;
  const unit = parseFloat(tr.querySelector(".unitPrice").value) || 0;

  const ppq = meter * unit;
  const total = ppq * qty;

  tr.querySelector(".pricePerQty").value = ppq.toFixed(2);
  tr.querySelector(".totalPrice").value = total.toFixed(2);

  calculateSummary();
}

// ==================== SUMMARY ====================
function calculateSummary() {
  let subtotal = 0;
  document.querySelectorAll(".totalPrice").forEach(input => {
    subtotal += parseFloat(input.value) || 0;
  });

  const ppn = subtotal * 0.11;
  const grand = subtotal + ppn;

  document.getElementById("subTotal").value = subtotal.toFixed(2);
  document.getElementById("ppn").value = ppn.toFixed(2);
  document.getElementById("grandTotal").value = grand.toFixed(2);
}

// ==================== SUBMIT ====================
document.getElementById("orderForm").addEventListener("submit", async e => {
  e.preventDefault();
  result.textContent = "⏳ Sending...";

  const res = await fetch(baseURL, {
    method: "POST",
    body: new FormData(orderForm)
  });

  const txt = await res.text();

  if (txt.includes("✅")) {
    result.textContent = "✅ Order berhasil dikirim!";
  } else {
    result.textContent = "❌ Error: " + txt;
  }
});

// INIT
loadDropdowns();
document.getElementById("addLine").addEventListener("click", addLine);
</script>

</body>
</html>
