<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan Sukses Jaya</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>

/* =========================================
   GLOBAL FORM LAYOUT
========================================= */
body {
  font-family: Arial, sans-serif;
  max-width: 1400px;
  width: 100%;
  margin: 40px auto;
  padding: 0 40px;
}

h2 {
  color: #2b5da4;
  text-align: center;
  margin-bottom: 30px;
}

/* =========================================
   INPUTS
========================================= */
input, select, textarea {
  font-size: 14px;
  font-family: inherit;
}

input[type="text"], input[type="number"], input[type="date"], .choices__inner {
  height: 42px !important;
  min-height: 42px !important;
  border-radius: 6px !important;
  border: 1px solid #d3d7dc !important;
  padding: 0 12px !important;
  background: white;
  box-sizing: border-box;
}

/* FIX: Choices dropdown text fully center aligned */
.choices__inner {
  display: flex !important;
  align-items: center !important;
}

/* FIX: Date label spacing */
.top-row div label {
  margin-bottom: 12px !important;
  font-weight: bold;
}

/* =========================================
   TOP ROW (DATE & CUSTOMER)
========================================= */
.top-row {
  display: flex;
  gap: 50px;
  margin-bottom: 40px;
}
.top-row div { flex: 1; }

/* =========================================
   TABLE (XERO STYLE)
========================================= */

.xero-table {
  width: 100%;
  border-collapse: separate !important;
  border-spacing: 0 6px;
}

.xero-table th {
  background: #f7f7f7;
  padding: 14px 16px;
  border-top: 1px solid #e5e5ea;
  border-bottom: 1px solid #e5e5ea;
  white-space: nowrap;
  font-weight: 600;
}

.xero-table td {
  padding: 14px 16px;
  border-top: 1px solid #e5e5ea;
  border-bottom: 1px solid #e5e5ea;
  background: white;
  vertical-align: middle !important;
}

/* Column divider */
.xero-table td + td,
.xero-table th + th {
  border-left: 1px solid #f0f0f0;
}

/* Drag handle */
.col-drag {
  cursor: grab;
  width: 18px !important;
  font-size: 16px;
  text-align: center;
  opacity: 0.5;
  padding: 0 !important;
}

/* Delete row button */
.delete-btn {
  background: none;
  border: none;
  color: red;
  font-size: 20px;
  cursor: pointer;
}

/* Inner inputs auto-fit */
.xero-table input {
  width: 100%;
}

/* ADD ROW button */
#addLine {
  margin-top: 12px;
  background: #e7f1ff;
  border: 1px solid #c7dcff;
  padding: 10px 16px;
  border-radius: 4px;
  color: #2b5da4;
  cursor: pointer;
  font-weight: 600;
}

/* =========================================
   SUMMARY (RIGHT SIDE TOTALS)
========================================= */

/* FIX BLUE ALIGNMENT: EXACT MATCH WITH TOTAL COLUMN WIDTH */
.summary-box {
  width: 170px;              /* SAME WIDTH as TOTAL column */
  float: right;
  margin-top: 25px;
  margin-right: 4px !important; /* pixel-perfect alignment */
}

.summary-box table {
  width: 100%;
}

.summary-box td:first-child {
  text-align: left;
  padding-right: 10px;
}
.summary-box td:last-child {
  text-align: right;
}

/* =========================================
   FOOTER NOTES + SUBMIT BUTTON
========================================= */
.footer-area {
  margin-top: 55px;
  display: flex;
  justify-content: space-between;
  gap: 40px;
}

.footer-left {
  width: 55%;
}

textarea {
  width: 100%;
  min-height: 120px;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  resize: vertical;
  font-size: 15px;
}

/* FIX GREEN — Submit button same width as TOTAL and under summary */
.footer-right {
  width: 170px !important; /* SAME WIDTH as summary box */
  text-align: right;
}

#submitBtn {
  width: 100% !important;
  background: #2b5da4;
  border: none;
  padding: 12px 22px;
  border-radius: 6px;
  color: white;
  cursor: pointer;
  font-weight: 600;
  font-size: 15px;
  margin-top: 20px !important;
}

#submitBtn:hover {
  background: #1f4988;
}

/* =========================================
   MOBILE RESPONSIVE
========================================= */
@media (max-width: 768px) {
  
  body { padding: 0 10px; }
  .top-row { flex-direction: column; }

  .summary-box {
    float: none;
    width: 100%;
    margin-right: 0 !important;
  }

  .footer-area {
    flex-direction: column;
  }

  .footer-left,
  .footer-right {
    width: 100% !important;
    text-align: left !important;
  }

  #submitBtn {
    width: 100% !important;
  }
}

/* PRINT */
@media print {
  @page { size: landscape; }
  #addLine, button, textarea { display: none !important; }
}

  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">

  <!-- TOP (DATE + CUSTOMER) -->
  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" name="date" required>
    </div>

    <div>
      <label>Customer</label><br>
      <select id="customer" name="customer" required></select>
    </div>
  </div>

  <!-- TABLE -->
  <table class="xero-table">
    <thead>
      <tr>
        <th style="width:25px;"></th>
        <th style="min-width:260px; width:32%;">Item</th>
        <th style="min-width:90px; width:10%;">Meter</th>
        <th style="min-width:80px; width:8%;">Qty</th>
        <th style="min-width:120px; width:15%;">Unit Price</th>
        <th style="min-width:120px; width:15%;">Price/Qty</th>
        <th style="min-width:140px; width:18%;">Total</th>
        <th style="width:40px;"></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <!-- SUMMARY -->
  <div class="summary-box">
    <table>
      <tr><td>Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
      <tr><td>PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
      <tr><td><b>Grand Total</b></td><td><input type="text" id="grandTotal" readonly></td></tr>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="footer-area">
    <div class="footer-left">
      <label>Catatan tambahan</label>
      <textarea name="catatan"></textarea>
    </div>

    <div class="footer-right">
      <button type="submit" id="submitBtn">Kirim Order</button>
    </div>
  </div>

</form>

<!-- MODAL -->
<div id="modal-bg">
  <div id="modal-box">
    <h3>Tambah Customer Baru</h3>
    <input id="newCustomerName" placeholder="Nama customer..." />
    <button id="saveCustomerBtn">Simpan</button>
  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
