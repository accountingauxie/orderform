<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Form Pemesanan – Xero Style</title>

  <!-- Choices.js -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">

  <!-- Sortable (drag handle) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --border: #d6dce1;
      --border-light: #e3e7eb;
      --header-bg: #f4f6f8;
      --text-muted: #697386;
      --blue: #0075c9;
      --bg: #f5f7fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #1f2933;
    }

    /* ================= TOP BAR ================= */
    .top-bar {
      padding: 14px 36px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
    }
    .top-bar span {
      font-weight: 400;
      color: #9aa5b1;
    }

    /* ================= PAGE WRAPPER ================= */
    .page-wrap {
      display: flex;
      justify-content: center;
      padding: 32px 0 56px;
    }

    /* ================= MAIN CARD ================= */
    .invoice-card {
      width: 1380px;
      max-width: 94vw;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 40px 42px 52px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    h2.card-title {
      margin: 0 0 18px;
      font-size: 20px;
      font-weight: 600;
    }

    /* ================= HEADER FORM GRID ================= */
    .header-grid {
      display: grid;
      grid-template-columns: 2.1fr 1.2fr 1.2fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="date"],
    select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      background: #fff;
    }

    input[type="number"] {
      width: 100%;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
      text-align: right;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #9fb3c8;
      box-shadow: 0 0 0 1px #cbd2e1;
    }

    /* ================= CHOICES.JS ================= */
    .choices {
      margin-bottom: 0;
    }

    .choices__inner {
      min-height: 36px !important;
      padding: 6px 10px !important;
      font-size: 13px !important;
      border-radius: 4px !important;
      border: 1px solid var(--border) !important;
      background-color: #ffffff !important;
    }

    .choices__list--single {
      padding: 0 !important;
    }

    .choices__placeholder {
      opacity: 1;
      color: #111827;
    }

    /* ================= TABLE WRAPPER ================= */
    .table-wrapper {
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
      margin-bottom: 16px;
    }

    table.items-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .items-table col:nth-child(1) { width: 34px; }
    .items-table col:nth-child(2) { width: 120px; }
    .items-table col:nth-child(3) { width: 34%; }
    .items-table col:nth-child(4) { width: 80px; }
    .items-table col:nth-child(5) { width: 70px; }
    .items-table col:nth-child(6) { width: 120px; }
    .items-table col:nth-child(7) { width: 110px; }
    .items-table col:nth-child(8) { width: 110px; }
    .items-table col:nth-child(9) { width: 120px; }
    .items-table col:nth-child(10){ width: 32px; }

    .items-table th {
      background: var(--header-bg);
      padding: 9px 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      height: 36px;
      border-bottom: 1px solid var(--border-light);
      text-align: left;
      white-space: nowrap;
    }

    .items-table td {
      padding: 8px 8px;
      height: 42px;
      border-bottom: 1px solid var(--border-light);
      background: #ffffff;
    }

    .items-table tbody tr:last-child td {
      border-bottom: none;
    }

    .items-table th:nth-child(4),
    .items-table th:nth-child(5),
    .items-table th:nth-child(6),
    .items-table th:nth-child(7),
    .items-table th:nth-child(8),
    .items-table th:nth-child(9),
    .items-table td:nth-child(4),
    .items-table td:nth-child(5),
    .items-table td:nth-child(6),
    .items-table td:nth-child(7),
    .items-table td:nth-child(8),
    .items-table td:nth-child(9) {
      text-align: right;
    }

    .items-table td:nth-child(3),
    .items-table th:nth-child(3) {
      text-align: left;
    }

    .items-table select {
      height: 34px;
      font-size: 13px;
    }

    .drag-handle {
      cursor: grab;
      font-size: 16px;
      color: #8d99a6;
      text-align: center;
    }

    .delete-row {
      cursor: pointer;
      color: #d33;
      font-size: 16px;
      text-align: center;
      user-select: none;
    }

    /* ================= ADD ROW BUTTON ================= */
    .add-row-btn {
      margin-top: 4px;
      margin-bottom: 24px;
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 4px;
      cursor: pointer;
    }

    .add-row-btn:hover {
      background: #f4f5f7;
    }

    /* ================= NOTES + TOTALS ================= */
    .notes-and-totals {
      display: grid;
      grid-template-columns: 2.1fr 1fr;
      gap: 32px;
      align-items: flex-start;
    }

    textarea {
      width: 100%;
      height: 170px;
      border-radius: 4px;
      border: 1px solid var(--border);
      padding: 10px;
      font-size: 13px;
      resize: none;
    }

    .totals-box {
      text-align: right;
      font-size: 13px;
      padding-top: 4px;
      line-height: 1.7;
      color: #111827;
    }

    .totals-box .label {
      margin-right: 10px;
    }

    .totals-box span.value {
      min-width: 80px;
      display: inline-block;
      text-align: right;
    }

    .totals-box .grand-label {
      font-weight: 600;
      color: #111827;
    }

    .totals-box .grand-value {
      font-weight: 700;
    }

    /* ================= APPROVE BUTTON ================= */
    .footer-actions {
      text-align: right;
      margin-top: 28px;
    }

    .btn-primary {
      padding: 8px 28px;
      background: var(--blue);
      color: #ffffff;
      border-radius: 4px;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #005da0;
    }
  </style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
  UXILIUM <span>Accounting Management Services</span>
</div>

<!-- PAGE -->
<div class="page-wrap">
  <div class="invoice-card">

    <h2 class="card-title">Form Pemesanan</h2>

    <!-- HEADER FORM -->
    <div class="header-grid">
      <div>
        <span class="field-label">Contact</span>
        <select id="customerSelect"></select>
      </div>

      <div>
        <span class="field-label">Issue date</span>
        <input type="date" id="issueDate">
      </div>

      <div>
        <span class="field-label">Order number</span>
        <input type="text" id="orderNumber" readonly>
      </div>
    </div>

    <!-- TABLE SECTION -->
    <div class="table-wrapper">
      <table class="items-table">
        <colgroup>
          <col><col><col><col><col><col><col><col><col><col>
        </colgroup>
        <thead>
        <tr>
          <th></th>
          <th>Type</th>
          <th>Item</th>
          <th>Meter</th>
          <th>Qty</th>
          <th>Unit Price</th>
          <th>Discount / Unit</th>
          <th>Price/Qty</th>
          <th>Total</th>
          <th></th>
        </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>

    <button class="add-row-btn" type="button" onclick="addRow()">Add row ▾</button>

    <!-- NOTES + TOTAL -->
    <div class="notes-and-totals">
      <div>
        <span class="field-label">Catatan:</span>
        <textarea id="notes"></textarea>
      </div>

      <div class="totals-box">
        <div>
          <span class="label">DPP</span>
          <span class="value" id="dppDisplay">0.00</span>
        </div>
        <div>
          <span class="label">PPN 11%</span>
          <span class="value" id="ppnDisplay">0.00</span>
        </div>
        <div style="margin-top: 6px;">
          <span class="label grand-label">Grand Total</span>
          <span class="value grand-value" id="grandTotalDisplay">0.00</span>
        </div>
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn-primary" type="button">Approve</button>
    </div>

  </div>
</div>

<!-- SCRIPTS -->
<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="script.js"></script>

</body>
</html>
