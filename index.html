<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan (Xero Style)</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
body {
  font-family: Arial, sans-serif;
  max-width: 1200px;
  width: 100%;
  margin: 40px auto;
  padding: 0 20px;
}

h2 { 
  color: #2b5da4; 
  text-align: center; 
}

/* === GLOBAL FIELDS === */
input[type="text"],
input[type="number"],
input[type="date"],
textarea,
.choices__inner {
  height: 36px !important;
  min-height: 36px !important;
  line-height: 36px !important;
  padding: 0 10px !important;
  font-size: 14px !important;
  border: 1px solid #d0d4da !important;
  border-radius: 4px !important;
  box-sizing: border-box !important;
  background: #fff;
}

textarea {
  height: auto !important;
  line-height: normal !important;
  padding: 8px !important;
}

/* Date input fix */
input[type="date"]::-webkit-calendar-picker-indicator {
  filter: opacity(50%);
  cursor: pointer;
}

/* TOP ROW (Fix spacing) */
.top-row {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
  align-items: center;
}

.top-row label {
  font-weight: bold;
  margin-bottom: 4px;
  display: inline-block;
}

/* TABLE */
.xero-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  table-layout: fixed;
}

.xero-table th {
  background: #f3f3f3;
  border-bottom: 2px solid #dedede;
  padding: 10px;
  font-size: 14px;
  text-align: left;
}

.xero-table td {
  padding: 10px;
  border-bottom: 1px solid #f0f0f0;
}

/* Drag handle */
.col-drag {
  cursor: grab;
  font-size: 18px;
  text-align: center;
}

/* Delete button */
.delete-btn {
  background: none;
  border: none;
  color: #d9534f;
  font-size: 18px;
  cursor: pointer;
}

/* Add row */
#addLine {
  margin-top: 12px;
  background: #e8f1ff;
  border: 1px solid #c9dafb;
  padding: 8px 14px;
  border-radius: 4px;
  color: #2b5da4;
  font-size: 14px;
  cursor: pointer;
}

/* SUMMARY BOX */
.summary-box {
  margin-top: 25px;
  width: 300px;
  margin-left: auto;
}

.summary-box input {
  height: 32px !important;
  padding: 6px !important;
  border-radius: 4px !important;
}

/* === CHOICES DROPDOWN FIX FOR XERO LOOK === */
.choices {
  width: 100% !important;
}

.choices__inner {
  display: flex !important;
  align-items: center !important;
  background: #fff !important;
  padding-right: 30px !important;
}

.choices[data-type*="select-one"]::after {
  right: 8px !important;
  top: 50% !important;
  width: 4px !important;
  height: 4px !important;
  margin-top: -2px !important;
  border-width: 4px 3px 0 3px !important;
  border-color: #777 transparent transparent transparent !important;
}

.choices[data-type*="select-one"].is-open::after {
  border-width: 0 3px 4px 3px !important;
  border-color: transparent transparent #777 transparent !important;
}

/* Modal — tetap seperti sebelumnya */
#modal-bg {
  display:none;
  position:fixed;
  left:0; top:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.45);
  z-index:2000;
}

#modal-box {
  background:white;
  width:350px;
  padding:20px;
  border-radius:8px;
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%,-50%);
}

#modal-box input {
  width:100%;
  height:36px !important;
  padding:0 10px !important;
  border-radius:4px !important;
}

#modal-box button {
  margin-top:12px;
  width:100%;
  height:40px;
  background:#2b5da4;
  border:none;
  border-radius:4px;
  color:white;
  cursor:pointer;
}

  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">
  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" name="date" required>
    </div>

    <div>
      <label>Customer</label><br>
      <select id="customer" name="customer" required></select>
    </div>
  </div>

  <table class="xero-table">
    <thead>
      <tr>
        <th></th>
        <th>Item</th>
        <th>Meter</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Price/Qty</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <div class="summary-box">
    <table>
      <tr><td>Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
      <tr><td>PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
      <tr><td><b>Grand Total</b></td><td><input type="text" id="grandTotal" readonly></td></tr>
    </table>
  </div>

  <label>Catatan tambahan</label><br>
  <textarea name="catatan" rows="3"></textarea><br>

  <button type="submit">Kirim Order</button>
</form>

<!-- Modal Add Customer -->
<div id="modal-bg">
  <div id="modal-box">
    <h3>Tambah Customer Baru</h3>
    <input id="newCustomerName" placeholder="Nama customer..." />
    <button id="saveCustomerBtn">Simpan</button>
  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
