<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>

/* ===================== GLOBAL ======================= */

body {
  font-family: Arial, sans-serif;
  max-width: 1400px;
  margin: 40px auto;
  padding: 0 40px;
}

h2 {
  text-align: center;
  margin-bottom: 35px;
  color: #2b5da4;
}

label {
  font-weight: bold;
  margin-bottom: 6px;
  display: inline-block;
}

input, select, textarea {
  font-size: 14px;
  font-family: inherit;
}

input[type="text"], input[type="number"], input[type="date"],
.choices__inner {
  height: 42px !important;
  border-radius: 6px !important;
  border: 1px solid #d3d7dc !important;
  padding: 0 12px !important;
}

/* Center-align choices text */
.choices__inner {
  display: flex !important;
  align-items: center !important;
}

/* ============== TOP ROW ============== */

.top-row {
  display: flex;
  gap: 60px;
  margin-bottom: 40px;
}

.top-row div {
  flex: 1;
}

/* ============== TABLE ============== */

.xero-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 6px;
}

.xero-table th {
  background: #f7f7f7;
  padding: 14px;
  border-top: 1px solid #ddd;
  border-bottom: 1px solid #ddd;
}

.xero-table td {
  padding: 14px;
  background: white;
  border-top: 1px solid #e8e8e8;
  border-bottom: 1px solid #e8e8e8;
  vertical-align: middle;
}

.xero-table td + td,
.xero-table th + th {
  border-left: 1px solid #f0f0f0;
}

.col-drag {
  width: 18px;
  cursor: grab;
  opacity: 0.5;
  text-align: center;
}

.delete-btn {
  background: none;
  border: none;
  color: red;
  font-size: 20px;
  cursor: pointer;
}

#addLine {
  margin-top: 12px;
  padding: 10px 16px;
  background: #e7f1ff;
  border: 1px solid #c7dcff;
  border-radius: 4px;
  color: #2b5da4;
  font-weight: 600;
}

/* ======================================================
   MAIN 2-COLUMN LAYOUT: LEFT (notes) & RIGHT (summary)
====================================================== */

.main-bottom {
  margin-top: 40px;
  display: flex;
  justify-content: space-between;
  gap: 50px;
}

/* LEFT SIDE (NOTES) */

.left-notes {
  flex: 1; /* lebar lebih besar */
}

textarea {
  width: 100%;
  min-height: 140px;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  resize: vertical;
}

/* RIGHT SIDE = SUMMARY + BUTTON */

.right-summary {
  width: 230px; /* FIX, supaya sejajar dengan TOTAL column */
}

/* Summary box */

.summary-box table {
  width: 100%;
}

.summary-box td:first-child {
  text-align: left;
}
.summary-box td:last-child {
  text-align: right;
}

.summary-box input {
  width: 100%;
  height: 38px;
  border-radius: 6px;
  border: 1px solid #ccc;
  padding: 0 10px;
}

/* Button */

#submitBtn {
  width: 100%;
  padding: 12px;
  margin-top: 25px;
  border-radius: 6px;
  border: none;
  background: #2b5da4;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#submitBtn:hover {
  background: #1f4c89;
}

/* ============== MODAL ============== */

#modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 9999;
}

#modal-box {
  background: white;
  padding: 20px;
  width: 350px;
  border-radius: 8px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

  </style>
</head>

<body>

<h2>Form Pemesanan</h2>

<form id="orderForm">

  <!-- TOP ROW -->
  <div class="top-row">
    <div>
      <label>Date</label>
      <input type="date" id="date" required>
    </div>
    <div>
      <label>Customer</label>
      <select id="customer" required></select>
    </div>
  </div>

  <!-- TABLE -->
  <table class="xero-table">
    <thead>
      <tr>
        <th style="width:25px"></th>
        <th style="width:32%">Item</th>
        <th style="width:10%">Meter</th>
        <th style="width:8%">Qty</th>
        <th style="width:15%">Unit Price</th>
        <th style="width:15%">Price/Qty</th>
        <th style="width:15%">Total</th>
        <th style="width:40px"></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <!-- ======================================================
       2-COLUMN LAYOUT BOTTOM (LEFT NOTES + RIGHT SUMMARY)
  ====================================================== -->
  <div class="main-bottom">

    <!-- LEFT (NOTES) -->
    <div class="left-notes">
      <label>Catatan tambahan</label>
      <textarea></textarea>
    </div>

    <!-- RIGHT (SUMMARY + BUTTON) -->
    <div class="right-summary">
      
      <div class="summary-box">
        <table>
          <tr><td>Sub Total</td><td><input id="subTotal" readonly></td></tr>
          <tr><td>PPN 11%</td><td><input id="ppn" readonly></td></tr>
          <tr><td><b>Grand Total</b></td><td><input id="grandTotal" readonly></td></tr>
        </table>
      </div>

      <button id="submitBtn" type="submit">Kirim Order</button>
    </div>

  </div>

</form>

<!-- MODAL -->
<div id="modal-bg">
  <div id="modal-box">
    <h3>Tambah Customer Baru</h3>
    <input id="newCustomerName" placeholder="Nama customer..." />
    <button id="saveCustomerBtn">Simpan</button>
  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
