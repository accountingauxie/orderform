<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan (Xero Style)</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
    }
    h2 {
      color: #2b5da4;
      text-align: center;
    }

    /* Input Styling */
    input, select, textarea {
      font-size: 14px;
      font-family: inherit;
    }
    input[type="text"], input[type="number"], input[type="date"], .choices__inner {
      height: 42px !important;
      min-height: 42px !important;
      line-height: 42px !important;
      font-size: 14px !important;
      border-radius: 6px !important;
      border: 1px solid #d5d9de !important;
      padding: 0 12px !important;
      box-sizing: border-box;
    }

    /* Date Fix */
    input[type="date"] {
      appearance: none;
      -webkit-appearance: none;
      background: #fff;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: opacity(60%);
    }

    /* Top Row Layout */
    .top-row {
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .top-row div {
      flex: 1;
    }
    .top-row label {
      font-weight: bold;
    }

    /* Table Styling */
    .xero-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
      table-layout: fixed;
    }
    .xero-table th {
      background: #f7f7f7;
      border-bottom: 2px solid #e5e5e5;
      padding: 12px;
      font-weight: 600;
      color: #444;
    }
    .xero-table td {
      padding: 12px;
      border-bottom: 1px solid #ececec;
    }
    .col-drag {
      text-align: center;
      cursor: grab;
      width: 15px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: red;
      font-size: 20px;
      cursor: pointer;
    }

    #addLine {
      margin-top: 12px;
      background: #e7f1ff;
      border: 1px solid #c7dcff;
      padding: 10px 16px;
      border-radius: 4px;
      color: #2b5da4;
      font-weight: 600;
      cursor: pointer;
    }

    /* Summary Box */
    .summary-box {
      margin-top: 30px;
      width: 350px;
      margin-left: auto;
    }
    .summary-box input {
      height: 32px;
      padding: 6px;
      border: 1px solid #d5d9de;
      border-radius: 4px;
    }

    /* Choices.js */
    .choices {
      width: 100% !important;
    }
    .choices__inner {
      display: flex !important;
      align-items: center !important;
      background: white !important;
    }

    /* Dropdown Arrow */
    .choices[data-type*="select-one"]::after {
      width: 6px !important;
      height: 6px !important;
      border-width: 5px 4px 0 4px !important;
      border-color: #666 transparent transparent transparent !important;
      right: 12px !important;
      top: 50% !important;
      margin-top: -3px !important;
    }
    .choices[data-type*="select-one"].is-open::after {
      border-width: 0 4px 5px 4px !important;
      border-color: transparent transparent #666 transparent !important;
    }

    /* Modal */
    #modal-bg {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      z-index:2000;
    }
    #modal-box {
      background:white;
      width:350px;
      padding:20px;
      border-radius:8px;
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
    }
    #modal-box input {
      width:100%;
      height:40px;
      margin-top:10px;
      padding:8px;
      border-radius:6px;
      border:1px solid #ccc;
    }
    #modal-box button {
      margin-top:12px;
      width:100%;
      height:40px;
      background:#2b5da4;
      border:none;
      border-radius:6px;
      color:white;
      cursor:pointer;
    }

    /* Print Landscape */
    @media print {
      @page {
        size: landscape;
      }
      #addLine, button, textarea {
        display: none !important;
      }
    }
  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">

  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" name="date" required>
    </div>
    <div>
      <label>Customer</label><br>
      <select id="customer" name="customer" required></select>
    </div>
  </div>

  <table class="xero-table">
    <thead>
      <tr>
        <th></th>
        <th style="width:280px;">Item</th>
        <th style="width:80px;">Meter</th>
        <th style="width:70px;">Qty</th>
        <th style="width:120px;">Unit Price</th>
        <th style="width:110px;">Price/Qty</th>
        <th style="width:130px;">Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <div class="summary-box">
    <table>
      <tr><td>Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
      <tr><td>PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
      <tr><td><b>Grand Total</b></td><td><input type="text" id="grandTotal" readonly></td></tr>
    </table>
  </div>

  <label>Catatan tambahan</label><br>
  <textarea name="catatan" rows="3"></textarea><br>

  <button type="submit" id="submitBtn">Kirim Order</button>

</form>

<!-- Modal Add Customer -->
<div id="modal-bg">
  <div id="modal-box">
    <h3>Tambah Customer Baru</h3>
    <input id="newCustomerName" placeholder="Nama customer..." />
    <button id="saveCustomerBtn">Simpan</button>
  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
