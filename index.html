<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan (Xero Style)</title>

  <!-- UI libraries -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
  body {
    font-family: Arial, sans-serif;
    max-width: 1200px;
    width: 100%;
    margin: 40px auto;
    padding: 0 20px;
  }

  h2 { 
    color: #2b5da4; 
    text-align: center; 
  }

  /* Global form font */
  input, select, textarea {
    font-size: 14px;
    font-family: inherit;
  }

  /* TOP SECTION */
  .top-row {
    display: flex;
    align-items: center;
    gap: 40px;
    width: 100%;
  }

  .top-row div {
    flex: 1;
  }

  .top-row label {
    font-weight: bold;
  }

  /* === DATE INPUT XERO STYLE === */
  input[type="date"] {
    height: 42px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #d5d9de;
    box-sizing: border-box;
  }

  /* TABLE */
  .xero-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 25px;
    table-layout: fixed;
  }

  .xero-table th {
    background: #f7f7f7;
    border-bottom: 2px solid #e5e5e5;
    padding: 12px;
    font-weight: 600;
    color: #444;
    text-align: left;
  }

  .xero-table td {
    padding: 10px;
    border-bottom: 1px solid #ececec;
  }

  /* Input di dalam tabel */
  .xero-table input, 
  .xero-table select {
    width: 100%;
    height: 42px;
    padding: 8px 12px;
    border: 1px solid #d5d9de;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
  }

  /* COLUMN WIDTHS */
  th:nth-child(1) { width: 40px; }
  th:nth-child(2) { width: 320px; }
  th:nth-child(3) { width: 140px; }
  th:nth-child(4) { width: 110px; }
  th:nth-child(5) { width: 160px; }
  th:nth-child(6) { width: 160px; }
  th:nth-child(7) { width: 180px; }
  th:nth-child(8) { width: 40px; }

  .col-drag {
    cursor: grab;
    font-size: 18px;
    text-align: center;
  }

  .delete-btn {
    background: none;
    border: none;
    color: red;
    font-size: 20px;
    cursor: pointer;
  }

  #addLine {
    margin-top: 12px;
    background: #e7f1ff;
    border: 1px solid #c7dcff;
    padding: 10px 16px;
    border-radius: 4px;
    color: #2b5da4;
    font-weight: 600;
    cursor: pointer;
  }

  .summary-box {
    margin-top: 30px;
    width: 350px;
    margin-left: auto;
  }

  .summary-box input[type="text"] {
    height: 32px;
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid #d5d9de;
    box-sizing: border-box;
  }

  .summary-label {
    text-align: right;
    padding-right: 10px;
  }

  .summary-total {
    font-weight: bold;
    font-size: 17px;
  }

  textarea {
    border-radius: 4px;
    border: 1px solid #d5d9de;
    padding: 8px 10px;
    box-sizing: border-box;
  }

  button[type="submit"] {
    margin-top: 20px;
    background: #2b5da4;
    padding: 12px 26px;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    font-size: 14px;
  }

  /* ===========================================================
     🔵 XERO MODERN STYLE — Choices.js Dropdown 
     =========================================================== */
  .choices {
      width: 100% !important;
  }

  .choices__inner {
      min-height: 42px !important;
      height: 42px !important;
      padding: 8px 12px !important;

      border: 1px solid #d5d9de !important;
      border-radius: 6px !important;
      background: #ffffff !important;

      display: flex;
      align-items: center;

      transition: all 0.18s ease-in-out;
      box-sizing: border-box;
  }

  .choices__list--single {
      padding: 4px 0 !important;
      font-size: 14px !important;
      color: #333 !important;
  }

  .choices__placeholder {
      opacity: 0.55 !important;
      color: #666 !important;
  }

  .choices.is-focused .choices__inner,
  .choices.is-open .choices__inner {
      border-color: #4c9aff !important;
      box-shadow: 0 0 0 3px rgba(76, 154, 255, 0.25) !important;
  }

  .choices__list--dropdown {
      border-radius: 6px !important;
      border: 1px solid #d3d7dd !important;
      margin-top: 4px !important;
      padding: 4px 0 !important;
      background: #ffffff !important;
      box-shadow: 0px 3px 8px rgba(0,0,0,0.06) !important;
  }

  .choices__list--dropdown .choices__item {
      padding: 10px 12px !important;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.12s;
  }

  .choices__list--dropdown .choices__item:hover {
      background: #f0f6ff !important;
  }

  .choices__list--dropdown .choices__item.is-selected {
      background: #e6f0ff !Important;
      font-weight: 600;
  }

  /* Arrow dropdown – biar tidak kepotong */
  .choices[data-type*="select-one"]::after {
      border-color: #666 transparent transparent transparent !important;
      margin-top: -2.5px !important;
  }

  .choices[data-type*="select-one"].is-open::after {
      border-color: transparent transparent #666 transparent !important;
  }

  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">
  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" name="date" required>
    </div>

    <div style="flex:1">
      <label>Customer</label><br>
      <select id="customer" name="customer" required></select>
    </div>
  </div>

  <table class="xero-table">
    <thead>
      <tr>
        <th class="col-drag"></th>
        <th>Item</th>
        <th>Meter</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Price/Qty</th>
        <th>Total</th>
        <th class="col-delete"></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <div class="summary-box">
    <table>
      <tr><td class="summary-label">Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
      <tr><td class="summary-label">PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
      <tr><td class="summary-label summary-total">Grand Total</td><td><input type="text" id="grandTotal" readonly></td></tr>
    </table>
  </div>

  <label>Catatan tambahan</label><br>
  <textarea name="catatan" rows="3"></textarea><br>

  <button type="submit">Kirim Order</button>
</form>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="https://accountingauxie.github.io/orderform/script.js"></script>

</body>
</html>
