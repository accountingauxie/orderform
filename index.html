<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan – Xero Ultra Modern Flat</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
/* =========================================
   PAGE – PURE FLAT
========================================= */
body {
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: #f3f4f6;       /* flat grey */
  margin: 0;
  padding: 40px 24px;
  display: flex;
  justify-content: center;
}

.wrapper {
  width: 100%;
  max-width: 1180px;
  background: #ffffff;       /* flat white */
  padding: 32px 36px;
  border-radius: 12px;
  border: 1px solid #e5e7eb; /* flat border */
}

/* =========================================
   HEADER – FLAT
========================================= */
h2 {
  color: #1f2937;            /* flat dark grey */
  font-size: 24px;
  font-weight: 600;
  text-align: center;
  margin: 0 0 6px 0;
}

.subheader {
  text-align: center;
  color: #6b7280;
  font-size: 13px;
  margin-bottom: 24px;
}

/* =========================================
   INPUTS – FLAT NEUTRAL
========================================= */
input, select, textarea {
  font-size: 14px;
  text-align: center !important;
}

input[type="text"],
input[type="number"],
input[type="date"],
.choices__inner {
  height: 42px !important;
  border-radius: 8px !important;
  border: 1px solid #d1d5db !important; /* flat neutral border */
  background: #ffffff !important;
  padding: 0 10px !important;
  transition: border-color .15s ease;
}

input:focus,
.choices__inner.is-focused,
.choices__inner.is-open {
  border-color: #2563eb !important;   /* Xero blue (flat) */
  box-shadow: none !important;        /* remove any glow */
  outline: none;
}

/* =========================================
   LAYOUT
========================================= */
.top-row {
  display: flex;
  gap: 32px;
  margin-bottom: 20px;
}

.top-row div { flex: 1; }

label {
  font-size: 13px;
  color: #374151;
  font-weight: 600;
  margin-bottom: 4px;
  display: block;
}

/* =========================================
   TABLE – PURE FLAT
========================================= */
.table-box {
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  overflow: hidden;
  background: #ffffff; /* flat */
}

.xero-table {
  width: 100%;
  border-collapse: collapse;
}

.xero-table thead th {
  background: #f9fafb;       /* flat grey */
  padding: 12px;
  font-size: 12px;
  font-weight: 600;
  color: #4b5563;
  border-bottom: 1px solid #e5e7eb;
  text-align: center;
}

.xero-table td {
  padding: 10px;
  border-bottom: 1px solid #f3f4f6;
  text-align: center;
  background: #ffffff;
}

.xero-table tbody tr:hover td {
  background: #f3f4f6; /* flat hover */
}

.xero-table input {
  width: 100%;
  border-radius: 6px !important;
}

/* Drag */
.col-drag {
  cursor: grab;
  opacity: 0.4;
  font-size: 18px;
}

/* Delete */
.delete-btn {
  background: none;
  border: none;
  color: #dc2626;
  font-size: 18px;
  cursor: pointer;
}

/* =========================================
   ADD ROW – FLAT
========================================= */
#addLine {
  margin-top: 14px;
  background: #e0e7ff;
  border: 1px solid #c7d2fe;
  color: #1e40af;
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}

#addLine:hover {
  background: #d4ddff;
}

/* =========================================
   SUMMARY – ULTRA CLEAN
========================================= */
.summary-box {
  width: 340px;
  float: right;
  background: #fafafa;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}

.summary-box table {
  width: 100%;
}

.summary-box td {
  padding: 6px 4px;
  font-size: 13px;
}

.summary-box input {
  height: 32px;
  border-radius: 6px;
  border: 1px solid #d1d5db;
  text-align: center !important;
}

/* =========================================
   FOOTER – FLAT
========================================= */
.footer-area {
  margin-top: 50px;
  display: flex;
  gap: 32px;
}

textarea {
  width: 100%;
  min-height: 110px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  padding: 10px;
  resize: vertical;
}

button[type="submit"] {
  background: #2563eb;          /* flat Xero blue */
  border: none;
  padding: 12px 24px;
  border-radius: 8px;
  color: white;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  transition: background .15s;
}

button[type="submit"]:hover {
  background: #1e54d3;
}

/* =========================================
   MODAL – FLAT
========================================= */
#modal-bg {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.40);
  z-index:2000;
}

#modal-box {
  background:#ffffff;
  width:320px;
  padding:20px;
  border-radius:12px;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  border:1px solid #e5e7eb;
}

/* Print */
@media print {
  @page { size: landscape; }
  #addLine, button, textarea { display: none !important; }
}
  </style>
</head>

<body>
  <div class="wrapper">

    <h2>Form Pemesanan</h2>
    <div class="subheader">Xero Ultra Modern — Pure Flat Version</div>

    <p id="result"></p>

    <form id="orderForm">

      <div class="top-row">
        <div>
          <label>Date</label>
          <input type="date" id="date" required>
        </div>

        <div>
          <label>Customer</label>
          <select id="customer" required></select>
        </div>
      </div>

      <div class="table-box">
        <table class="xero-table">
          <thead>
            <tr>
              <th style="width:25px;"></th>
              <th style="width:32%;">Product</th>
              <th>Meter</th>
              <th>Qty</th>
              <th>Unit Price</th>
              <th>Price/Qty</th>
              <th>Total</th>
              <th style="width:40px;"></th>
            </tr>
          </thead>
          <tbody id="orderBody"></tbody>
        </table>
      </div>

      <button type="button" id="addLine">+ Add row</button>

      <div class="summary-box">
        <table>
          <tr><td>Sub Total</td><td><input id="subTotal" readonly></td></tr>
          <tr><td>PPN 11%</td><td><input id="ppn" readonly></td></tr>
          <tr><td>Grand Total</td><td><input id="grandTotal" readonly></td></tr>
        </table>
      </div>

      <div class="footer-area">
        <div style="flex:1;">
          <label>Catatan tambahan</label>
          <textarea name="catatan"></textarea>
        </div>

        <div>
          <button type="submit" id="submitBtn">Kirim Order</button>
        </div>
      </div>

    </form>
  </div>

  <script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
