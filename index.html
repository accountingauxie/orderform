<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Order Form (Xero Style + Rupiah)</title>

  <!-- Choices + Sortable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
    }
    h2 { color: #2b5da4; text-align: center; }

    /* Customer row */
    .customer-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }
    .customer-row label { font-weight: bold; }

    /* Xero Table Style */
    .xero-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .xero-table th {
      background: #f7f7f7;
      color: #555;
      font-weight: 600;
      border-bottom: 2px solid #e5e5e5;
      padding: 10px;
    }
    .xero-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #ececec;
    }

    .col-drag { width: 22px; font-size: 18px; cursor: grab; }
    .col-item { width: 180px; }
    .col-desc { width: 300px; }
    .col-qty { width: 70px; }
    .col-price { width: 110px; text-align: right; }
    .col-amount { width: 130px; text-align: right; }
    .col-delete { width: 40px; text-align: center; }

    .xero-table input, .xero-table select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d2d2d2;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
      text-align: right;
    }

    .delete-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: #c00;
      cursor: pointer;
    }

    #addLine {
      margin-top: 10px;
      background: #e7f1ff;
      border: 1px solid #c7dcff;
      padding: 8px 14px;
      border-radius: 4px;
      color: #2b5da4;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"] {
      margin-top: 20px;
      background: #2b5da4;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    .summary-box {
      margin-top: 20px;
      width: 300px;
      margin-left: auto;
    }
    .summary-box table { width: 100%; }
    .summary-label { text-align: right; }
    .summary-total { font-weight: bold; font-size: 16px; }
  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">
  <label>Date</label>
  <input type="date" id="date" required>

  <div class="customer-row">
    <label>Customer</label>
    <select id="customer" name="customer" required></select>
  </div>

  <table class="xero-table">
    <thead>
      <tr>
        <th class="col-drag"></th>
        <th class="col-item">Item</th>
        <th class="col-desc">Description</th>
        <th class="col-qty">Qty</th>
        <th class="col-price">Price</th>
        <th class="col-amount">Amount</th>
        <th class="col-delete"></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <div class="summary-box">
    <table>
      <tr>
        <td class="summary-label">Sub Total</td>
        <td><input type="text" id="subTotal" readonly data-value="0"></td>
      </tr>
      <tr>
        <td class="summary-label">PPN 11%</td>
        <td><input type="text" id="ppn" readonly data-value="0"></td>
      </tr>
      <tr>
        <td class="summary-label summary-total">Grand Total</td>
        <td><input type="text" id="grandTotal" readonly data-value="0"></td>
      </tr>
    </table>
  </div>

  <label>Catatan tambahan</label>
  <textarea name="catatan" rows="3"></textarea>

  <button type="submit">Kirim Order</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<script>
const baseURL =
 "https://script.google.com/macros/s/AKfycbxb7ZrEd4D0DJG5JEqV0U6FepmRlquL2MeMCL-uwY1_CrmcxAqt7rXo8bwdB4JIc5oO/exec";

let productList = [];
let productDropdowns = [];

document.getElementById("date").value = new Date().toISOString().split("T")[0];

// === FORMAT RUPIAH ===
function formatRupiah(num) {
  if (!num || isNaN(num)) return "Rp 0";
  return "Rp " + Number(num).toLocaleString("id-ID");
}

// LOAD DROPDOWNS ======================
async function loadDropdowns() {
  const res = await fetch(baseURL + "?action=getdata");
  const data = await res.json();

  productList = data.products;

  const choiceCustomer = new Choices("#customer", { shouldSort: false });
  choiceCustomer.setChoices(
    data.customers.map(v => ({value:v,label:v})),
    "value","label",true
  );

  addLine(); addLine(); addLine();
}

// ADD ROW =============================
function addLine() {
  const idx = document.querySelectorAll("#orderBody tr").length + 1;

  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="col-drag">⋮⋮</td>

    <td class="col-item">
      <select class="product-select" name="product_${idx}"></select>
    </td>

    <td class="col-desc">
      <input type="text" name="desc_${idx}">
    </td>

    <td class="col-qty">
      <input type="number" step="1" class="qty" name="qty_${idx}">
    </td>

    <td class="col-price">
      <input type="text" readonly class="unitPrice" name="unit_${idx}" data-value="">
    </td>

    <td class="col-amount">
      <input type="text" readonly class="totalPrice" name="total_${idx}" data-value="">
    </td>

    <td class="col-delete">
      <button type="button" class="delete-btn">🗑</button>
    </td>
  `;

  orderBody.appendChild(tr);

  // Product dropdown
  const select = tr.querySelector(".product-select");
  const choice = new Choices(select, { searchEnabled:true, shouldSort:false });
  productDropdowns.push(choice);
  choice.setChoices(productList.map(v => ({value:v,label:v})), "value","label",true);

  select.addEventListener("change", () => updatePrice(tr));
  tr.querySelector(".qty").addEventListener("input", () => calculateRow(tr));
  tr.querySelector(".delete-btn").addEventListener("click", () => tr.remove());
}

// LOOKUP PRICE ===========================
async function updatePrice(tr) {
  const product = tr.querySelector(".product-select").value;
  const unitInput = tr.querySelector(".unitPrice");

  const res = await fetch(baseURL + "?action=getprice&product=" + encodeURIComponent(product));
  const priceRaw = parseFloat(await res.text()) || 0;

  unitInput.setAttribute("data-value", priceRaw);
  unitInput.value = formatRupiah(priceRaw);

  calculateRow(tr);
}

// CALCULATE ROW ===========================
function calculateRow(tr) {
  const qty = parseFloat(tr.querySelector(".qty").value) || 0;
  const unit = parseFloat(tr.querySelector(".unitPrice").getAttribute("data-value")) || 0;

  const total = qty * unit;

  const totalInput = tr.querySelector(".totalPrice");
  totalInput.setAttribute("data-value", total);
  totalInput.value = formatRupiah(total);

  calculateSummary();
}

// SUMMARY ================================
function calculateSummary() {
  let subtotal = 0;
  document.querySelectorAll(".totalPrice").forEach(el => {
    subtotal += parseFloat(el.getAttribute("data-value")) || 0;
  });

  const ppn = subtotal * 0.11;
  const grand = subtotal + ppn;

  document.getElementById("subTotal").setAttribute("data-value", subtotal);
  document.getElementById("ppn").setAttribute("data-value", ppn);
  document.getElementById("grandTotal").setAttribute("data-value", grand);

  document.getElementById("subTotal").value = formatRupiah(subtotal);
  document.getElementById("ppn").value = formatRupiah(ppn);
  document.getElementById("grandTotal").value = formatRupiah(grand);
}

// SUBMIT =================================
document.getElementById("orderForm").addEventListener("submit", async e => {
  e.preventDefault();

  // Convert formatted values to raw numbers before sending
  document.querySelectorAll("[data-value]").forEach(el => {
    el.value = el.getAttribute("data-value");
  });

  const res = await fetch(baseURL, {
    method: "POST",
    body: new FormData(orderForm)
  });

  const text = await res.text();
  result.textContent = text.includes("✅")
    ? "✅ Order tersimpan!"
    : "❌ Error: " + text;
});

// Disable Enter
document.getElementById("orderForm").addEventListener("keydown", e => {
  if (e.key === "Enter") e.preventDefault();
});

// INIT
loadDropdowns();

// Drag-sort
Sortable.create(orderBody, {
  handle: ".col-drag",
  animation: 150
});
</script>

</body>
</html>
