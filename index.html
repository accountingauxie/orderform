<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Order Form (Xero Style)</title>

  <!-- Choices CSS -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">

  <!-- SortableJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 960px;
      margin: 40px auto;
    }
    h2 { color: #2b5da4; text-align: center; }

    .top-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .xero-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .xero-table th {
      background: #f7f7f7;
      border-bottom: 2px solid #e5e5e5;
      padding: 10px;
      font-weight: 600;
      color: #444;
    }
    .xero-table td {
      padding: 10px;
      border-bottom: 1px solid #ececec;
    }

    .xero-table input, .xero-table select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }

    .col-drag { width: 30px; cursor: grab; font-size: 18px; }
    .col-delete { width: 40px; text-align: center; }

    .delete-btn {
      background: none;
      border: none;
      color: red;
      font-size: 18px;
      cursor: pointer;
    }

    #addLine {
      margin-top: 10px;
      background: #e7f1ff;
      border: 1px solid #c7dcff;
      padding: 8px 14px;
      border-radius: 4px;
      color: #2b5da4;
      font-weight: 600;
      cursor: pointer;
    }

    .summary-box {
      margin-top: 20px;
      width: 300px;
      margin-left: auto;
    }

    .summary-label {
      text-align: right;
      padding-right: 10px;
    }

    .summary-total {
      font-weight: bold;
      font-size: 16px;
    }

    button[type="submit"] {
      margin-top: 20px;
      background: #2b5da4;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">
  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" name="date" required>
    </div>

    <div>
      <label>Customer</label><br>
      <select id="customer" name="customer" required></select>
    </div>
  </div>

  <table class="xero-table">
    <thead>
      <tr>
        <th class="col-drag"></th>
        <th>Item</th>
        <th>Meter</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Price/Qty</th>
        <th>Total</th>
        <th class="col-delete"></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <div class="summary-box">
    <table>
      <tr>
        <td class="summary-label">Sub Total</td>
        <td><input type="text" id="subTotal" readonly data-value="0"></td>
      </tr>
      <tr>
        <td class="summary-label">PPN 11%</td>
        <td><input type="text" id="ppn" readonly data-value="0"></td>
      </tr>
      <tr>
        <td class="summary-label summary-total">Grand Total</td>
        <td><input type="text" id="grandTotal" readonly data-value="0"></td>
      </tr>
    </table>
  </div>

  <label>Catatan tambahan</label><br>
  <textarea name="catatan" rows="3"></textarea><br>

  <button type="submit">Kirim Order</button>
</form>

<!-- Choices.js placed last for GitHub Pages compatibility -->
<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>

<!-- OUR SCRIPT FILE -->
<script src="script.js"></script>

</body>
</html>
