<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan - Xero Style</title>

  <!-- Choices & Sortable -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --xero-blue: #0075c9;
      --xero-blue-dark: #005da0;
      --border: #d6dce1;
      --border-light: #e3e7eb;
      --header-bg: #f0f3f5;
      --text-main: #1f2933;
      --text-muted: #7b8794;
      --page-bg: #f5f7fa;
      --input-radius: 4px;
      --card-radius: 4px;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body { margin: 0; background: var(--page-bg); color: var(--text-main); }

    .top-bar {
      padding: 12px 40px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-wrap { padding: 32px 40px; }

    .invoice-card {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 24px 24px 28px;
    }

    h2.card-title { margin: 0 0 18px; font-size: 18px; font-weight: 600; }

    /* HEADER GRID */
    .header-grid {
      display: grid;
      grid-template-columns: 2.2fr 1.2fr 1.4fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .field-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }

    input[type="text"], input[type="date"], textarea {
      width: 100%;
      border-radius: var(--input-radius);
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: 13px;
      background: #ffffff;
    }

    .choices__inner {
      border-radius: var(--input-radius) !important;
      border-color: var(--border) !important;
      min-height: 34px !important;
      padding: 4px 8px !important;
      font-size: 13px;
    }

    /* Restore UI patch */
    .items-table-wrap { overflow: visible !important; }

    .items-table input[type="text"],
    .items-table input[type="number"],
    .items-table select {
      height: 28px !important;
      padding: 2px 6px !important;
      font-size: 12px !important;
    }

    .items-table td { padding-top: 4px !important; padding-bottom: 4px !important; }

    .choices__inner {
      min-height: 28px !important;
      padding: 0 6px !important;
      font-size: 12px !important;
    }

    .choices__list--dropdown .choices__item {
      padding: 4px 6px !important;
      font-size: 12px !important;
    }

    table.items-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
    .items-table th { background: var(--header-bg); font-weight: 600; color: var(--text-muted); padding: 8px 6px; }

    .drag-handle { cursor: grab; }

    .add-row-btn { font-size: 12px; padding: 4px 8px; }

  </style>
</head>
<body>

  <div class="top-bar">
    <span class="logo-text">UXILIUM</span>
    <span style="font-weight:400; font-size:12px; color:#9aa5b1;">Accounting Management Services</span>
  </div>

  <div class="page-wrap">
    <div class="invoice-card">
      <h2 class="card-title">Form Pemesanan</h2>

      <!-- HEADER -->
      <div class="header-grid">
        <div class="field-group">
          <span class="field-label">Contact</span>
          <select id="customerSelect"></select>
        </div>

        <div class="field-group">
          <span class="field-label">Issue date</span>
          <input type="date" id="issueDate">
        </div>

        <div class="field-group">
          <span class="field-label">Order number</span>
          <input type="text" id="orderNumber">
        </div>
      </div>

      <!-- TABLE -->
      <div class="items-table-wrap">
        <table class="items-table">
          <thead>
          <tr>
            <th></th>
            <th>Type</th>
            <th>Item</th>
            <th>Meter</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Discount / Unit</th>
            <th>Price/Qty</th>
            <th>Total</th>
            <th></th>
          </tr>
          </thead>
          <tbody id="itemsBody"></tbody>
        </table>

        <div class="add-row-bar">
          <button type="button" class="add-row-btn" onclick="addRow()">Add row ▾</button>
        </div>
      </div>

      <div class="notes-and-totals">
        <div class="notes-box">
          <span class="field-label">Catatan:</span>
          <textarea id="notes"></textarea>
        </div>

        <div class="totals-box">
          <div>DPP <span id="dppDisplay">0.00</span></div>
          <div>PPN 11% <span id="ppnDisplay">0.00</span></div>
          <div class="total-line">Grand Total <span id="grandTotalDisplay">0.00</span></div>
        </div>
      </div>

      <div class="footer-actions">
        <button type="button" class="btn-primary">Approve</button>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
