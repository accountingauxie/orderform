<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">

  <style>
    :root {
      --border: #d6dce1;
      --border-light: #e3e7eb;
      --header-bg: #f6f7f9;
      --text-muted: #64748b;
      --blue: #1976d2;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      font-family: "Segoe UI", sans-serif;
    }

    /* -------- TOP BAR ---------- */
    .top-bar {
      background: #ffffff;
      border-bottom: 1px solid #e3e7eb;
      padding: 14px 38px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* -------- PAGE WRAP ---------- */
    .page-wrap {
      padding: 32px 0;
      display: flex;
      justify-content: center;
    }

    /* -------- CARD ---------- */
    .invoice-card {
      width: 900px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      padding: 28px 32px 40px;
    }

    h2.card-title {
      margin: 0 0 20px;
      font-size: 20px;
      font-weight: 600;
    }

    /* -------- HEADER GRID ---------- */
    .header-grid {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1.2fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .field-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }

    input, select {
      width: 100%;
      height: 34px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid var(--border);
      padding: 6px 8px;
      background: #fff;
    }

    /* -------- TABLE ---------- */
    table.items-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
    }

    .items-table th {
      background: var(--header-bg);
      padding: 8px 6px;
      font-size: 12px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-light);
      font-weight: 600;
    }

    .items-table td {
      padding: 6px;
      border-bottom: 1px solid var(--border-light);
    }

    .items-table input,
    .items-table select {
      height: 32px;
      font-size: 13px;
      padding: 4px 6px;
    }

    .drag-handle {
      cursor: grab;
      font-size: 14px;
      color: #777;
    }

    .delete-row {
      cursor: pointer;
      color: #d33;
      font-size: 14px;
    }

    .add-row-btn {
      margin-top: 8px;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }

    /* -------- CHOICES FIX ---------- */
    .choices__inner {
      min-height: 34px !important;
      padding: 4px 6px !important;
      border-color: var(--border) !important;
      border-radius: 4px !important;
      font-size: 13px !important;
    }

    /* -------- NOTES & TOTAL ---------- */
    .notes-and-totals {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      font-size: 13px;
      resize: none;
    }

    .totals-box {
      text-align: right;
      font-size: 14px;
      line-height: 1.6rem;
      padding-right: 6px;
    }

    .total-line {
      margin-top: 6px;
      font-size: 16px;
      font-weight: 700;
    }

    /* -------- BUTTON ---------- */
    .footer-actions {
      text-align: right;
      margin-top: 28px;
    }

    .btn-primary {
      padding: 8px 24px;
      font-size: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #145ca1;
    }
  </style>
</head>

<body>

<div class="top-bar">
  UXILIUM <span style="font-weight:400; color:#9aa5b1;">Accounting Management Services</span>
</div>

<div class="page-wrap">
  <div class="invoice-card">

    <h2 class="card-title">Form Pemesanan</h2>

    <div class="header-grid">
      <div>
        <span class="field-label">Contact</span>
        <select id="customerSelect"></select>
      </div>

      <div>
        <span class="field-label">Issue date</span>
        <input type="date" id="issueDate">
      </div>

      <div>
        <span class="field-label">Order number</span>
        <input type="text" id="orderNumber">
      </div>
    </div>

    <!-- ITEMS TABLE -->
    <table class="items-table">
      <thead>
      <tr>
        <th></th>
        <th>Type</th>
        <th>Item</th>
        <th>Meter</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Discount/Unit</th>
        <th>Price/Qty</th>
        <th>Total</th>
        <th></th>
      </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <button class="add-row-btn" onclick="addRow()">Add row ▾</button>

    <div class="notes-and-totals">
      <div>
        <span class="field-label">Catatan:</span>
        <textarea></textarea>
      </div>

      <div class="totals-box">
        <div>DPP 0.00</div>
        <div>PPN 11% 0.00</div>
        <div class="total-line">Grand Total 0.00</div>
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn-primary">Approve</button>
    </div>

  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>

</body>
</html>
