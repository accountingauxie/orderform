<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Order Form (Xero Style)</title>

  <!-- FIXED CDN – COMPATIBLE WITH GITHUB PAGES -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 960px;
      margin: 40px auto;
    }
    h2 { color: #2b5da4; text-align: center; }

    .top-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .xero-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .xero-table th {
      background: #f7f7f7;
      border-bottom: 2px solid #e5e5e5;
      padding: 10px;
      font-weight: 600;
      color: #444;
    }
    .xero-table td {
      padding: 10px;
      border-bottom: 1px solid #ececec;
    }

    .xero-table input, .xero-table select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }

    .col-drag { width: 30px; cursor: grab; font-size: 18px; }
    .col-delete { width: 40px; text-align: center; }

    .delete-btn {
      background: none;
      border: none;
      color: red;
      font-size: 18px;
      cursor: pointer;
    }

    #addLine {
      margin-top: 10px;
      background: #e7f1ff;
      border: 1px solid #c7dcff;
      padding: 8px 14px;
      border-radius: 4px;
      color: #2b5da4;
      font-weight: 600;
      cursor: pointer;
    }

    .summary-box {
      margin-top: 20px;
      width: 300px;
      margin-left: auto;
    }

    .summary-label {
      text-align: right;
      padding-right: 10px;
    }

    .summary-total {
      font-weight: bold;
      font-size: 16px;
    }

    button[type="submit"] {
      margin-top: 20px;
      background: #2b5da4;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>Form Pemesanan</h2>
<p id="result"></p>

<form id="orderForm">
  <div class="top-row">
    <div>
      <label>Date</label><br>
      <input type="date" id="date" name="date" required>
    </div>

    <div>
      <label>Customer</label><br>
      <select id="customer" name="customer" required></select>
    </div>
  </div>

  <table class="xero-table">
    <thead>
      <tr>
        <th class="col-drag"></th>
        <th>Item</th>
        <th>Meter</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Price/Qty</th>
        <th>Total</th>
        <th class="col-delete"></th>
      </tr>
    </thead>
    <tbody id="orderBody"></tbody>
  </table>

  <button type="button" id="addLine">+ Add row</button>

  <div class="summary-box">
    <table>
      <tr>
        <td class="summary-label">Sub Total</td>
        <td><input type="text" id="subTotal" readonly data-value="0"></td>
      </tr>
      <tr>
        <td class="summary-label">PPN 11%</td>
        <td><input type="text" id="ppn" readonly data-value="0"></td>
      </tr>
      <tr>
        <td class="summary-label summary-total">Grand Total</td>
        <td><input type="text" id="grandTotal" readonly data-value="0"></td>
      </tr>
    </table>
  </div>

  <label>Catatan tambahan</label><br>
  <textarea name="catatan" rows="3"></textarea><br>

  <button type="submit">Kirim Order</button>
</form>

<!-- FIXED: Load Choices.js AFTER HTML -->
<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>

<script>
const baseURL =
 "https://script.google.com/macros/s/AKfycbxb7ZrEd4D0DJG5JEqV0U6FepmRlquL2MeMCL-uwY1_CrmcxAqt7rXo8bwdB4JIc5oO/exec";

let productList = [];
let productDropdowns = [];

document.getElementById("date").value = new Date().toISOString().split("T")[0];

function formatRupiah(num) {
  return "Rp " + Number(num || 0).toLocaleString("id-ID");
}

// Load dropdowns
async function loadDropdowns() {
  const res = await fetch(baseURL + "?action=getdata");
  const data = await res.json();

  productList = data.products;

  const choiceCustomer = new Choices("#customer", { shouldSort:false });
  choiceCustomer.setChoices(
    data.customers.map(v=>({value:v,label:v})),
    "value","label",true
  );

  addLine(); addLine(); addLine();   // Default 3 rows
}

// Add row
function addLine() {
  const idx = document.querySelectorAll("#orderBody tr").length + 1;
  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td class="col-drag">⋮⋮</td>
    <td><select class="product-select" name="product_${idx}"></select></td>
    <td><input type="number" step="0.01" class="meter" name="meter_${idx}"></td>
    <td><input type="number" step="1" class="qty" name="qty_${idx}"></td>
    <td><input type="text" readonly class="unitPrice" name="unit_${idx}" data-value=""></td>
    <td><input type="text" readonly class="ppq" name="ppq_${idx}" data-value=""></td>
    <td><input type="text" readonly class="totalPrice" name="total_${idx}" data-value=""></td>
    <td><button type="button" class="delete-btn">🗑</button></td>
  `;

  orderBody.appendChild(tr);

  const select = tr.querySelector(".product-select");
  const choice = new Choices(select, { searchEnabled:true, shouldSort:false });
  choice.setChoices(productList.map(v=>({value:v,label:v})), "value","label", true);

  select.addEventListener("change", ()=> updatePrice(tr));
  tr.querySelector(".meter").addEventListener("input", ()=> calculateRow(tr));
  tr.querySelector(".qty").addEventListener("input", ()=> calculateRow(tr));
  tr.querySelector(".delete-btn").addEventListener("click", ()=> tr.remove());
}

// Lookup price
async function updatePrice(tr) {
  const product = tr.querySelector(".product-select").value;
  const unitInput = tr.querySelector(".unitPrice");

  const res = await fetch(baseURL + "?action=getprice&product=" + encodeURIComponent(product));
  const price = parseFloat(await res.text()) || 0;

  unitInput.setAttribute("data-value", price);
  unitInput.value = formatRupiah(price);

  calculateRow(tr);
}

// Calculate row
function calculateRow(tr) {
  const meter = parseFloat(tr.querySelector(".meter").value) || 0;
  const qty = parseFloat(tr.querySelector(".qty").value) || 0;
  const price = parseFloat(tr.querySelector(".unitPrice").getAttribute("data-value")) || 0;

  const ppq = meter * price;
  const total = ppq * qty;

  tr.querySelector(".ppq").setAttribute("data-value", ppq);
  tr.querySelector(".ppq").value = formatRupiah(ppq);

  tr.querySelector(".totalPrice").setAttribute("data-value", total);
  tr.querySelector(".totalPrice").value = formatRupiah(total);

  calculateSummary();
}

// Summary
function calculateSummary() {
  let subtotal = 0;
  document.querySelectorAll(".totalPrice").forEach(el=>{
    subtotal += parseFloat(el.getAttribute("data-value")) || 0;
  });

  const ppn = subtotal * 0.11;
  const grand = subtotal + ppn;

  document.getElementById("subTotal").value = formatRupiah(subtotal);
  document.getElementById("ppn").value = formatRupiah(ppn);
  document.getElementById("grandTotal").value = formatRupiah(grand);
}

// Submit
document.getElementById("orderForm").addEventListener("submit", async e=>{
  e.preventDefault();

  // Replace formatted fields with raw numbers for sending
  document.querySelectorAll("[data-value]").forEach(el=>{
    el.value = el.getAttribute("data-value");
  });

  const res = await fetch(baseURL, {
    method: "POST",
    body: new FormData(orderForm)
  });

  const txt = await res.text();
  result.textContent = txt.includes("✅")
    ? "✅ Order tersimpan!"
    : "❌ Error: " + txt;
});

// Disable Enter
document.getElementById("orderForm").addEventListener("keydown", e=>{
  if (e.key === "Enter") e.preventDefault();
});

// Init
loadDropdowns();

// Enable drag-sort
Sortable.create(orderBody, {
  handle: ".col-drag",
  animation: 150
});
</script>

</body>
</html>
