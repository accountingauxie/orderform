<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan - Xero Style</title>

  <!-- Choices -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">

  <style>
    :root {
      --xero-blue: #0075c9;
      --border: #d6dce1;
      --border-light: #e3e7eb;
      --header-bg: #f5f7fa;
      --text-main: #1f2933;
      --text-muted: #7b8794;
      --input-radius: 6px;
      --card-radius: 6px;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: "Segoe UI", sans-serif;
      color: var(--text-main);
    }

    /* ===================== TOP BAR ===================== */
    .top-bar {
      padding: 14px 32px;
      font-weight: 600;
      font-size: 16px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    /* ===================== PAGE WRAPPER ===================== */
    .page-wrap {
      padding: 32px;
      display: flex;
      justify-content: center;
    }

    /* ===================== CARD ===================== */
    .invoice-card {
      width: 1200px;
      padding: 32px;
      border-radius: var(--card-radius);
      border: 1px solid var(--border-light);
      background: #fff;
    }

    h2.card-title {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 22px;
      font-weight: 600;
    }

    /* ===================== HEADER GRID ===================== */
    .header-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 24px;
      margin-bottom: 28px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: var(--input-radius);
      border: 1px solid var(--border);
      background: #fff;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* ===================== TABLE ===================== */
    table.items-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }

    .items-table th {
      background: var(--header-bg);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-light);
      text-align: left;
    }

    .items-table td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-light);
    }

    .items-table input,
    .items-table select {
      height: 36px;
      font-size: 13px;
      padding: 6px 8px;
    }

    .drag-handle {
      cursor: grab;
      color: #9aa5b1;
      font-size: 18px;
    }

    .delete-row {
      cursor: pointer;
      color: #d33;
      font-size: 16px;
    }

    /* FIX: Choices dropdown height normal */
    .choices__inner {
      min-height: 36px !important;
      padding: 6px 8px !important;
      font-size: 13px !important;
      border-radius: var(--input-radius) !important;
      border-color: var(--border) !important;
    }

    .choices__list--dropdown .choices__item {
      font-size: 13px !important;
      padding: 6px 10px !important;
    }

    /* ===================== TOTALS ===================== */
    .notes-and-totals {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
    }

    .totals-box {
      font-size: 14px;
      line-height: 1.8rem;
      text-align: right;
    }

    .totals-box .total-line {
      margin-top: 6px;
      font-size: 17px;
      font-weight: 700;
    }

    /* ===================== BUTTON ===================== */
    .footer-actions {
      margin-top: 24px;
      text-align: right;
    }

    .btn-primary {
      padding: 10px 22px;
      background: var(--xero-blue);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #005da0;
    }
  </style>
</head>
<body>

<div class="top-bar">Form Pemesanan</div>

<div class="page-wrap">
  <div class="invoice-card">

    <h2 class="card-title">Form Pemesanan</h2>

    <!-- HEADER -->
    <div class="header-grid">
      <div>
        <span class="field-label">Contact</span>
        <select id="customerSelect"></select>
      </div>

      <div>
        <span class="field-label">Issue date</span>
        <input type="date" id="issueDate">
      </div>

      <div>
        <span class="field-label">Order number</span>
        <input type="text" id="orderNumber">
      </div>
    </div>

    <!-- TABLE -->
    <table class="items-table">
      <thead>
      <tr>
        <th></th>
        <th>Type</th>
        <th>Item</th>
        <th>Meter</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Discount/Unit</th>
        <th>Price/Qty</th>
        <th>Total</th>
        <th></th>
      </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <button onclick="addRow()">Add row ▾</button>

    <!-- NOTES + TOTALS -->
    <div class="notes-and-totals">

      <div>
        <span class="field-label">Catatan:</span>
        <textarea id="notes"></textarea>
      </div>

      <div class="totals-box">
        <div>DPP <span id="dppDisplay">0.00</span></div>
        <div>PPN 11% <span id="ppnDisplay">0.00</span></div>
        <div class="total-line">Grand Total <span id="grandTotalDisplay">0.00</span></div>
      </div>

    </div>

    <div class="footer-actions">
      <button class="btn-primary">Approve</button>
    </div>

  </div>
</div>

<script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="script.js"></script>

</body>
</html>
