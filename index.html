<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan (Xero Modern)</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
/* =========================
   PAGE
========================= */
body {
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: #f5f7f9;
  margin: 0;
  padding: 40px 24px;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 1200px;
  background: white;
  padding: 32px 36px;
  border-radius: 12px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.06);
}

/* HEADER */
h2 {
  color: #2a497d;
  font-weight: 600;
  margin: 0;
  text-align: center;
  margin-bottom: 24px;
}

/* =========================
   INPUTS
========================= */
input, select, textarea {
  font-size: 14px;
  text-align: center !important;
  vertical-align: middle !important;
  font-family: inherit;
}

input[type="text"],
input[type="number"],
input[type="date"],
.choices__inner {
  height: 40px !important;
  min-height: 40px !important;
  border-radius: 6px !important;
  border: 1px solid #d4d8dd !important;
  padding: 0 10px !important;
  background: #fff;
  transition: 0.15s;
}

input:focus,
.choices__inner.is-focused,
.choices__inner.is-open {
  outline: none;
  border-color: #2d6cdf !important;
  box-shadow: 0 0 0 2px rgba(45,108,223,0.15);
}

/* =========================
   TOP ROW
========================= */
.top-row {
  display: flex;
  gap: 36px;
  margin-bottom: 20px;
}

.top-row div {
  flex: 1;
}

label {
  font-size: 13px;
  font-weight: 600;
  color: #364154;
  display: block;
  margin-bottom: 4px;
}

/* =========================
   TABLE (XERO MODERN)
========================= */
.table-wrapper {
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #e4e7ea;
  margin-bottom: 14px;
}

.xero-table {
  width: 100%;
  border-collapse: collapse;
}

.xero-table th {
  background: #f6f8fa;
  padding: 12px;
  border-bottom: 1px solid #e0e4e8;
  font-size: 12px;
  font-weight: 600;
  color: #556070;
  text-align: center;
  letter-spacing: 0.03em;
}

.xero-table td {
  background: #fff;
  padding: 10px;
  border-bottom: 1px solid #f0f2f5;
  text-align: center;
}

.xero-table tr:hover td {
  background: #f9fbfd;
}

.xero-table input {
  width: 100%;
  box-sizing: border-box;
}

/* DRAG */
.col-drag {
  cursor: grab;
  width: 24px !important;
  opacity: 0.5;
  user-select: none;
}

/* DELETE BUTTON */
.delete-btn {
  background: none;
  border: none;
  color: #cc3232;
  font-size: 18px;
  cursor: pointer;
}

/* ADD ROW */
#addLine {
  background: #eaf2ff;
  border: 1px solid #d1dcff;
  padding: 9px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #2d6cdf;
  cursor: pointer;
  transition: 0.2s;
}

#addLine:hover {
  background: #dfe9ff;
}

/* =========================
   SUMMARY BOX
========================= */
.summary-box {
  width: 360px;
  float: right;
  background: #fafbfc;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #e1e5eb;
  margin-top: 10px;
}

.summary-box table {
  width: 100%;
}

.summary-box td {
  padding: 6px 4px;
  font-size: 13px;
}

.summary-box input {
  height: 30px;
  font-size: 13px;
  border-radius: 4px;
  border: 1px solid #d4d7dc;
  text-align: center !important;
}

.summary-box tr:last-child td:first-child {
  font-weight: 700;
}

/* =========================
   FOOTER
========================= */
.footer-area {
  margin-top: 50px;
  display: flex;
  gap: 36px;
  justify-content: space-between;
}

.footer-left {
  flex: 1;
}

textarea {
  width: 100%;
  min-height: 110px;
  border-radius: 8px;
  border: 1px solid #d4d7dc;
  padding: 10px;
  resize: vertical;
}

.footer-right {
  width: 260px;
  text-align: right;
}

/* SUBMIT */
button[type="submit"] {
  background: #2d6cdf;
  border: none;
  padding: 10px 22px;
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.18s;
}

button[type="submit"]:hover {
  background: #255dc2;
}

/* =========================
   MODAL
========================= */
#modal-bg {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:2000;
}

#modal-box {
  background: #fff;
  width: 300px;
  padding: 20px;
  border-radius: 10px;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* PRINT */
@media print {
  @page { size: landscape; }
  #addLine, button, textarea { display: none !important; }
}
  </style>
</head>

<body>
  <div class="container">

    <h2>Form Pemesanan</h2>
    <p id="result"></p>

    <form id="orderForm">

      <!-- TOP -->
      <div class="top-row">
        <div>
          <label>Date</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div>
          <label>Customer</label>
          <select id="customer" name="customer" required></select>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-wrapper">
        <table class="xero-table">
          <thead>
            <tr>
              <th style="width:25px;"></th>
              <th style="width:32%;">Product</th>
              <th>Meter</th>
              <th>Qty</th>
              <th>Unit Price</th>
              <th>Price/Qty</th>
              <th>Total</th>
              <th style="width:40px;"></th>
            </tr>
          </thead>
          <tbody id="orderBody"></tbody>
        </table>
      </div>

      <button type="button" id="addLine">+ Add row</button>

      <!-- SUMMARY -->
      <div class="summary-box">
        <table>
          <tr><td>Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
          <tr><td>PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
          <tr><td>Grand Total</td><td><input type="text" id="grandTotal" readonly></td></tr>
        </table>
      </div>

      <!-- FOOTER -->
      <div class="footer-area">

        <div class="footer-left">
          <label>Catatan tambahan</label>
          <textarea name="catatan"></textarea>
        </div>

        <div class="footer-right">
          <button type="submit" id="submitBtn">Kirim Order</button>
        </div>
      </div>

    </form>
  </div>

  <!-- MODAL -->
  <div id="modal-bg">
    <div id="modal-box">
      <h3>Tambah Customer Baru</h3>
      <input id="newCustomerName" placeholder="Nama customer...">
      <button id="saveCustomerBtn">Simpan</button>
    </div>
  </div>

  <script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
