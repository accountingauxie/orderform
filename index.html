<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan – Xero Ultra Modern</title>

  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
/* =========================================
   PAGE LAYOUT – ULTRA MODERN
========================================= */
body {
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 42px 20px;
  display: flex;
  justify-content: center;
}

.wrapper {
  width: 100%;
  max-width: 1220px;
  background: #ffffff;
  padding: 36px 40px;
  border-radius: 18px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.05);
}

/* =========================================
   HEADER – XERO 2024 STYLE
========================================= */
h2 {
  font-size: 26px;
  font-weight: 700;
  margin: 0;
  text-align: center;
  color: #222e44;
}

.subheader {
  text-align: center;
  color: #6b7a8a;
  font-size: 13px;
  margin: 6px 0 24px;
  letter-spacing: 0.02em;
}

/* =========================================
   INPUTS – ROUNDED, CLEAN
========================================= */
input, select, textarea {
  font-size: 14px;
  font-family: inherit;
  text-align: center !important;
}

input[type="text"],
input[type="number"],
input[type="date"],
.choices__inner {
  height: 44px !important;
  border-radius: 10px !important;
  border: 1px solid #d6d9dd !important;
  padding: 0 12px !important;
  background: #ffffff;
  transition: 0.15s;
}

input:focus,
.choices__inner.is-focused,
.choices__inner.is-open {
  border-color: #4a92ff !important;
  box-shadow: 0 0 0 3px rgba(74,146,255,0.18);
  outline: none;
}

/* =========================================
   TOP ROW
========================================= */
.top-row {
  display: flex;
  gap: 36px;
  margin-bottom: 22px;
}

.top-row div { flex: 1; }

label {
  font-size: 13px;
  font-weight: 600;
  color: #374355;
  margin-bottom: 6px;
  display: block;
}

/* =========================================
   TABLE – ULTRA CLEAN
========================================= */
.table-box {
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #e1e4e8;
  background: #ffffff;
}

.xero-table {
  width: 100%;
  border-collapse: collapse;
}

.xero-table thead th {
  background: #f7f9fa;
  padding: 14px 10px;
  color: #5b6678;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  border-bottom: 1px solid #e5e7ea;
  letter-spacing: 0.03em;
}

.xero-table td {
  padding: 12px 10px;
  border-bottom: 1px solid #f0f2f4;
  text-align: center;
  background: #ffffff;
}

/* Hover effect */
.xero-table tbody tr:hover td {
  background: #f8fbff;
}

/* Inputs inside table */
.xero-table input {
  width: 100%;
  border-radius: 8px !important;
}

/* Drag icon */
.col-drag {
  cursor: grab;
  font-size: 18px;
  opacity: 0.5;
  user-select: none;
}

/* Delete button */
.delete-btn {
  background: none;
  border: none;
  color: #d03c3c;
  font-size: 20px;
  cursor: pointer;
  transition: 0.15s;
}

.delete-btn:hover {
  color: #b12f2f;
}

/* =========================================
   ADD ROW BUTTON – ULTRA MODERN
========================================= */
#addLine {
  margin-top: 14px;
  background: #eef4ff;
  border: 1px solid #c7d7ff;
  color: #2f6fe4;
  padding: 10px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: 0.15s;
}

#addLine:hover {
  background: #e2ecff;
}

/* =========================================
   SUMMARY BOX – CLEAN
========================================= */
.summary-box {
  width: 380px;
  float: right;
  background: #fafbfd;
  padding: 18px;
  border-radius: 12px;
  border: 1px solid #dbe0e6;
  margin-top: 20px;
}

.summary-box table {
  width: 100%;
}

.summary-box td {
  padding: 8px 4px;
  font-size: 13px;
}

.summary-box input {
  height: 36px;
  border-radius: 8px;
  border: 1px solid #d0d4db;
  text-align: center !important;
  font-size: 13px;
}

.summary-box tr:last-child td:first-child {
  font-weight: 700;
}

/* =========================================
   FOOTER – NOTES + BUTTON
========================================= */
.footer-area {
  margin-top: 60px;
  display: flex;
  gap: 40px;
}

textarea {
  width: 100%;
  min-height: 110px;
  border-radius: 12px;
  border: 1px solid #d6d9dd;
  padding: 12px;
  font-size: 14px;
  resize: vertical;
}

.footer-right {
  width: 260px;
  text-align: right;
}

/* SUBMIT BUTTON – XERO BLUE */
button[type="submit"] {
  background: #2f6fe4;
  border: none;
  padding: 12px 26px;
  border-radius: 12px;
  color: white;
  font-weight: 600;
  cursor: pointer;
  font-size: 15px;
  transition: 0.2s;
}

button[type="submit"]:hover {
  background: #275ec7;
}

/* =========================================
   MODAL
========================================= */
#modal-bg {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:2000;
}

#modal-box {
  background:#fff;
  width:320px;
  padding:22px;
  border-radius:14px;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  box-shadow:0 10px 30px rgba(0,0,0,0.18);
}

/* PRINT */
@media print {
  @page { size: landscape; }
  #addLine, button, textarea { display: none !important; }
}
  </style>
</head>

<body>
  <div class="wrapper">

    <h2>Form Pemesanan</h2>
    <div class="subheader">Xero Ultra Modern UI • Clean • Minimal • Centered Layout</div>

    <p id="result"></p>

    <form id="orderForm">

      <!-- TOP -->
      <div class="top-row">
        <div>
          <label>Date</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div>
          <label>Customer</label>
          <select id="customer" name="customer" required></select>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-box">
        <table class="xero-table">
          <thead>
            <tr>
              <th style="width:24px;"></th>
              <th style="width:32%;">Product</th>
              <th>Meter</th>
              <th>Qty</th>
              <th>Unit Price</th>
              <th>Price/Qty</th>
              <th>Total</th>
              <th style="width:40px;"></th>
            </tr>
          </thead>
          <tbody id="orderBody"></tbody>
        </table>
      </div>

      <button type="button" id="addLine">+ Add row</button>

      <!-- SUMMARY -->
      <div class="summary-box">
        <table>
          <tr><td>Sub Total</td><td><input type="text" id="subTotal" readonly></td></tr>
          <tr><td>PPN 11%</td><td><input type="text" id="ppn" readonly></td></tr>
          <tr><td>Grand Total</td><td><input type="text" id="grandTotal" readonly></td></tr>
        </table>
      </div>

      <!-- FOOTER -->
      <div class="footer-area">

        <div style="flex:1;">
          <label>Catatan tambahan</label>
          <textarea name="catatan"></textarea>
        </div>

        <div class="footer-right">
          <button type="submit" id="submitBtn">Kirim Order</button>
        </div>

      </div>

    </form>
  </div>

  <!-- MODAL -->
  <div id="modal-bg">
    <div id="modal-box">
      <h3 style="margin-top:0;">Tambah Customer</h3>
      <input id="newCustomerName" placeholder="Nama customer..." style="width:100%; margin-bottom:10px;">
      <button id="saveCustomerBtn" style="width:100%; background:#2f6fe4; border:none; padding:10px; border-radius:10px; color:#fff; font-size:14px;">Simpan</button>
    </div>
  </div>

  <script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
