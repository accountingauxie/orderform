<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan - Xero Style</title>

  <!-- Choices.js -->
  <link rel="stylesheet" href="https://unpkg.com/choices.js/public/assets/styles/choices.min.css">

  <style>
    :root {
      --xero-blue: #0075c9;
      --xero-blue-dark: #005da0;
      --border: #d6dce1;
      --border-light: #e3e7eb;
      --header-bg: #f0f3f5;
      --text-main: #1f2933;
      --text-muted: #7b8794;
      --page-bg: #f5f7fa;
      --input-radius: 4px;
      --card-radius: 4px;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--page-bg);
      color: var(--text-main);
    }

    .top-bar {
      padding: 12px 40px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .page-wrap {
      padding: 32px 40px;
    }

    .invoice-card {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 24px 24px 28px;
    }

    h2.card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    /* HEADER GRID */
    .header-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1.2fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      border-radius: var(--input-radius);
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: 13px;
      background: #ffffff;
    }

    .choices__inner {
      border-radius: var(--input-radius) !important;
      border-color: var(--border) !important;
      min-height: 36px !important;
      padding: 6px 8px !important;
      font-size: 13px;
    }

    .choices__inner.is-focused,
    .choices.is-open .choices__inner {
      border-color: var(--xero-blue) !important;
    }

    /* TABLE */
    .items-table-wrap {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      overflow: hidden;
    }

    table.items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .items-table thead {
      background: var(--header-bg);
    }

    .items-table th,
    .items-table td {
      padding: 8px;
      border-bottom: 1px solid var(--border-light);
    }

    .items-table input {
      width: 100%;
      font-size: 12px;
      padding: 6px 6px;
      border-radius: var(--input-radius);
      border: 1px solid var(--border-light);
    }

    .drag-handle {
      cursor: grab;
      font-size: 16px;
      text-align: center;
    }

    .delete-row {
      cursor: pointer;
      text-align: center;
      font-size: 16px;
      color: #b4b4b4;
    }

    .delete-row:hover {
      color: #d64541;
    }

    .add-row-bar {
      padding: 6px 10px;
      border-top: 1px solid var(--border-light);
      background: #f8fafb;
    }

    .add-row-btn {
      font-size: 12px;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      background: #ffffff;
    }

    /* NOTES & TOTALS */
    .notes-and-totals {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      margin-top: 18px;
      gap: 16px;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 13px;
    }

    .totals-row.total-line {
      font-size: 16px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 6px;
      font-weight: 600;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .btn-primary {
      padding: 8px 24px;
      border-radius: 4px;
      background: var(--xero-blue);
      color: white;
      cursor: pointer;
      border: none;
      font-size: 14px;
      font-weight: 600;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-box {
      width: 420px;
      background: #ffffff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    }

    .modal-box label {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
      gap: 8px;
    }

    .btn-cancel {
      padding: 7px 16px;
      font-size: 12px;
      background: #e4e7eb;
      border: 1px solid #d2d7dd;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    UXILIUM <span style="font-weight:400; color:#9aa5b1">Accounting Management Services</span>
  </div>

  <div class="page-wrap">
    <div class="invoice-card">

      <h2 class="card-title">Form Pemesanan</h2>

      <!-- HEADER -->
      <div class="header-grid">
        <div class="field-group">
          <span class="field-label">Contact</span>
          <select id="customerSelect">
            <option value="add_new">➕ Add New Customer</option>
          </select>
        </div>

        <div class="field-group">
          <span class="field-label">Issue date</span>
          <input type="date" id="issueDate">
        </div>

        <div class="field-group">
          <span class="field-label">Order number</span>
          <input type="text" id="orderNumber" readonly>
        </div>
      </div>

      <!-- TABLE -->
      <div class="items-table-wrap">
        <table class="items-table">
          <thead>
          <tr>
            <th></th>
            <th>Item</th>
            <th>Meter</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Discount / Unit Price</th>
            <th>Price/Qty</th>
            <th>Total</th>
            <th></th>
          </tr>
          </thead>

          <tbody id="itemsBody">
          <tr>
            <td class="drag-handle">⋮⋮</td>
            <td><select class="item-choice"></select></td>
            <td><input type="number" class="meter-input"></td>
            <td><input type="number" class="qty-input"></td>
            <td><input type="number" class="unit-price-input"></td>
            <td><input type="number" class="discount-input" value="0"></td>
            <td><input type="number" class="priceqty-input" readonly></td>
            <td><input type="number" class="line-total-input" readonly></td>
            <td class="delete-row" onclick="deleteRow(this)">🗑</td>
          </tr>
          </tbody>
        </table>

        <div class="add-row-bar">
          <button class="add-row-btn" onclick="addRow()">Add row ▾</button>
        </div>
      </div>

      <!-- NOTES + TOTALS -->
      <div class="notes-and-totals">
        <div>
          <span class="field-label">Catatan:</span>
          <textarea id="notes"></textarea>
        </div>

        <div>
          <div class="totals-row">
            <span>DPP</span> <span id="dppDisplay">0.00</span>
          </div>
          <div class="totals-row">
            <span>PPN 11%</span> <span id="ppnDisplay">0.00</span>
          </div>
          <div class="totals-row total-line">
            <span>Grand Total</span> <span id="grandTotalDisplay">0.00</span>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="footer-actions">
        <button class="btn-primary">Approve</button>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-bg" class="modal-bg">
    <div class="modal-box">
      <h3>Add New Customer</h3>

      <label>Customer Name</label>
      <input type="text" id="newCustomerName">

      <label>Phone</label>
      <input type="text" id="newCustomerPhone">

      <label>Address</label>
      <textarea id="newCustomerAddress"></textarea>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" id="saveCustomerBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- LIBRARIES -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://unpkg.com/choices.js/public/assets/scripts/choices.min.js"></script>

  <!-- MAIN SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
